name: Get Real Super Partition Size

on:
  workflow_dispatch:

jobs:
  get-size:
    runs-on: ubuntu-latest

    steps:
      - name: Download Fastboot ROM
        run: |
          echo "Downloading ROM..."
          wget -q -O rom.tgz "https://cdnorg.d.miui.com/OS3.0.309.0.WPOINXM/tornado_in_global_images_OS3.0.309.0.WPOINXM_20260908.0000.00_16.0_in_a3a27f403f.tgz"

      - name: Extract ROM
        run: |
          echo "Extracting tar file..."
          mkdir -p extracted_rom
          tar -xf rom.tgz -C extracted_rom --strip-components=1 || tar -xf rom.tgz -C extracted_rom
          rm -f rom.tgz

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils file

      - name: Read actual super partition size
        run: |
          set -euo pipefail

          SUPER_PATH=$(find extracted_rom -name "super.img" -print -quit)
          if [ -z "$SUPER_PATH" ]; then
            echo "::error::super.img not found in the extracted ROM!"
            exit 1
          fi
          echo "Found super.img at: $SUPER_PATH"

          FILE_TYPE=$(file "$SUPER_PATH")
          echo "File type: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -qi sparse; then
            echo "Image is sparse — unsparsing to get the true declared size..."
            simg2img "$SUPER_PATH" super_raw.img
            REAL_SIZE=$(stat -c%s super_raw.img)
            rm -f super_raw.img
          else
            echo "Image is already raw."
            REAL_SIZE=$(stat -c%s "$SUPER_PATH")
          fi

          REAL_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$REAL_SIZE")

          echo "----------------------------------------"
          echo "ACTUAL DEVICE SUPER SIZE (bytes): $REAL_SIZE"
          echo "ACTUAL DEVICE SUPER SIZE (human): $REAL_SIZE_HUMAN"
          echo "Use this exact byte value for DEVICE_SUPER_SIZE_BYTES"
          echo "----------------------------------------"

          echo "SUPER_SIZE_BYTES=$REAL_SIZE" >> $GITHUB_ENV
