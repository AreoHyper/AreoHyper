name: 🔍 Standalone AeroHyper 2.0 Artifact Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit_artifact:
    name: "Audit AeroHyper ROM Artifact"
    runs-on: ubuntu-24.04
    steps:
      - name: "🧹 Clean Environment & Install Toolchain"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget unzip android-sdk-libsparse-utils python3 jq curl
          
          echo "📥 Installing lpunpack..."
          wget -q -O lpunpack https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack || wget -q -O lpunpack https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

      - name: "📥 Download Artifact from GitHub Actions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching artifact 10605504771 from Run 35513952567 (AreoHyper/AreoHyper)..."
          mkdir -p artifact_raw extracted_package
          
          # Download artifact archive directly via GitHub API
          curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AreoHyper/AreoHyper/actions/artifacts/10605504771/zip \
            -o artifact_archive.zip
          
          if [ ! -s artifact_archive.zip ]; then
            echo "Direct API download failed, falling back to GitHub CLI..."
            gh run download 35513952567 --repo AreoHyper/AreoHyper -D artifact_raw
            ZIP_FILE=$(find artifact_raw -name "*.zip" | head -1)
            cp "$ZIP_FILE" artifact_archive.zip
          fi
          
          unzip -q artifact_archive.zip -d artifact_raw
          
          # Unpack the inner Fastboot ROM ZIP if nested
          INNER_ZIP=$(find artifact_raw -type f -name "AeroHyper_2.0_Air_Fastboot.zip" | head -1)
          if [ -n "$INNER_ZIP" ]; then
            unzip -q "$INNER_ZIP" -d extracted_package
          else
            cp -r artifact_raw/* extracted_package/
          fi
          
          echo "Files unpacked from artifact:"
          ls -lh extracted_package/

      - name: "📂 Extract Super Partition & Logical Trees"
        run: |
          mkdir -p super_unpacked audit_tree/product audit_tree/system audit_tree/system_ext audit_tree/mi_ext
          
          SUPER="extracted_package/firmware-update/super.img"
          if [ ! -f "$SUPER" ]; then
            echo "❌ ERROR: super.img not found in the package!"
            exit 1
          fi
          
          echo "Checking if super.img is sparse..."
          if file "$SUPER" | grep -qi "sparse"; then
            echo "Converting sparse super.img to raw super.img..."
            simg2img "$SUPER" super_raw.img
            SUPER_TARGET="super_raw.img"
          else
            SUPER_TARGET="$SUPER"
          fi
          
          echo "Unpacking super.img..."
          lpunpack "$SUPER_TARGET" super_unpacked
          
          for part in system system_ext product mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              echo "Extracting EROFS filesystem for: $part"
              sudo fsck.erofs --extract="audit_tree/$part" "$IMG"
            fi
          done

      - name: "🔍 Run Full Forensic ROM Audit"
        run: |
          python3 - << 'EOF'
          import os, sys, zipfile, re

          print("==================================================")
          print("      AEROHYPER 2.0 FULL FORENSIC ARTIFACT AUDIT   ")
          print("==================================================")

          errors = 0
          warnings = 0

          # 1. Check Package Core Partitions
          print("\n[1] Checking Package Partitions & Scripts...")
          fw_dir = "extracted_package/firmware-update"
          required_imgs = ["boot.img", "init_boot.img", "vendor_boot.img", "dtbo.img", "vbmeta.img", "super.img"]
          for img in required_imgs:
              p = os.path.join(fw_dir, img)
              if os.path.exists(p):
                  mb = os.path.getsize(p) / (1024 * 1024)
                  print(f"  [PASS] {img:<16} ({mb:.2f} MB)")
              else:
                  print(f"  [FAIL] Missing image: {img}")
                  errors += 1

          bat_path = "extracted_package/windows_clean_install.bat"
          if os.path.exists(bat_path):
              with open(bat_path, "r") as f:
                  b_txt = f.read()
              if "--disable-verity --disable-verification" in b_txt and "erase userdata" in b_txt:
                  print("  [PASS] windows_clean_install.bat contains clean wipe & AVB disable flags.")
              else:
                  print("  [WARN] windows_clean_install.bat missing AVB or wipe flags.")
                  warnings += 1
          else:
              print("  [FAIL] windows_clean_install.bat missing from root!")
              errors += 1

          # 2. Check Modded Kashi Modules
          print("\n[2] Checking Injected Kashi Modules...")
          kashi_apps = {
              "HyperOS Launcher": "audit_tree/product/priv-app/MiuiHome/MiuiHome.apk",
              "Security Center": "audit_tree/product/priv-app/MIUISecurityCenterGlobal/MIUISecurityCenterGlobal.apk",
              "Always On Display": "audit_tree/product/priv-app/MIUIAod/MIUIAod.apk",
              "Theme Manager": "audit_tree/product/app/MIUIThemeManagerGlobal/MIUIThemeManagerGlobal.apk"
          }
          for name, path in kashi_apps.items():
              if os.path.exists(path):
                  size_mb = os.path.getsize(path) / (1024 * 1024)
                  print(f"  [PASS] {name:<18} -> Present ({size_mb:.2f} MB)")
              else:
                  print(f"  [FAIL] {name:<18} -> MISSING at {path}")
                  errors += 1

          # Verify App Vault in mi_ext
          vault_found = False
          for root, dirs, files in os.walk("audit_tree/mi_ext"):
              for f in files:
                  if "AppVault" in f or "MinusScreen" in f:
                      vault_found = True
                      print(f"  [PASS] App Vault/MinusScreen -> Found: {f}")
                      break
          if not vault_found:
              print("  [WARN] Modded App Vault not found in mi_ext tree.")
              warnings += 1

          # 3. Check Stale ART Cache Files (Must be clean)
          print("\n[3] Checking ART Cache Purge Status...")
          stale_art = []
          for root, dirs, files in os.walk("audit_tree/product"):
              for f in files:
                  if f.endswith((".odex", ".vdex", ".art")) and any(app in root for app in ["MiuiHome", "SecurityCenter", "MIUIAod", "ThemeManager"]):
                      stale_art.append(os.path.join(root, f))
          if not stale_art:
              print("  [PASS] Stale ART caches (.odex/.vdex/.art) completely purged.")
          else:
              print(f"  [WARN] Found {len(stale_art)} unpurged ART cache files.")
              warnings += 1

          # 4. Check Core Signature Verification Bypass in services.jar
          print("\n[4] Checking services.jar Signature Bypass...")
          services_jar = "audit_tree/system/system/framework/services.jar"
          if os.path.exists(services_jar):
              print("  [PASS] services.jar exists.")
              try:
                  with zipfile.ZipFile(services_jar, 'r') as jar:
                      dex_files = [f for f in jar.namelist() if f.endswith(".dex")]
                      patched = False
                      for d in dex_files:
                          dex_bytes = jar.read(d)
                          # Check for compareSignatures signature string inside DEX
                          if b"compareSignatures" in dex_bytes:
                              patched = True
                              break
                      if patched:
                          print(f"  [PASS] services.jar contains compareSignatures bytecode hook across {len(dex_files)} DEX file(s).")
                      else:
                          print("  [WARN] compareSignatures method token not indexed in DEX pools.")
                          warnings += 1
              except Exception as e:
                  print(f"  [WARN] Could not inspect services.jar internal DEX: {e}")
                  warnings += 1
          else:
              print(f"  [FAIL] services.jar missing at {services_jar}")
              errors += 1

          # 5. Check Pixel Unlimited Photos XML
          print("\n[5] Checking Google Photos Unlimited Backup...")
          pixel_xml = "audit_tree/product/etc/sysconfig/pixel_unlimited.xml"
          if os.path.exists(pixel_xml):
              with open(pixel_xml, "r") as f:
                  px_txt = f.read()
              if "PIXEL_2021_MIDYEAR_STORAGE" in px_txt:
                  print("  [PASS] pixel_unlimited.xml properly injected with Google Photos entitlement.")
              else:
                  print("  [WARN] pixel_unlimited.xml present but feature key missing.")
                  warnings += 1
          else:
              print("  [FAIL] pixel_unlimited.xml is missing from /product/etc/sysconfig/!")
              errors += 1

          # 6. Check UI Blur & Control Center in air.xml
          print("\n[6] Checking UI Window Blur & Control Center Flags...")
          air_xml_found = False
          for root, dirs, files in os.walk("audit_tree/product"):
              if "air.xml" in files:
                  air_xml_found = True
                  xml_path = os.path.join(root, "air.xml")
                  with open(xml_path, "r") as f:
                      content = f.read()
                  blur = 'name="support_window_blur">true' in content
                  cc = 'name="support_new_control_center">true' in content
                  if blur and cc:
                      print("  [PASS] air.xml forces both 'support_window_blur' and 'support_new_control_center' to TRUE.")
                  else:
                      print(f"  [WARN] air.xml flags -> Blur: {blur}, New CC: {cc}")
                      warnings += 1
          if not air_xml_found:
              print("  [FAIL] air.xml not found in product partition!")
              errors += 1

          # 7. Check 90 FPS Gaming Spoof & Camera HAL Safety
          print("\n[7] Checking Gaming Spoof & Hardware Camera HAL Integrity...")
          poco_model_found = False
          safe_device_intact = True

          for root, dirs, files in os.walk("audit_tree"):
              if "build.prop" in files:
                  bp_path = os.path.join(root, "build.prop")
                  with open(bp_path, "r", errors="ignore") as f:
                      bp_data = f.read()
                  if "ro.product.model=23049PCD8G" in bp_data:
                      poco_model_found = True
                  if "ro.hardware=marble" in bp_data or "ro.product.vendor.device=marble" in bp_data:
                      safe_device_intact = False

          if poco_model_found:
              print("  [PASS] ro.product.model correctly spoofed to POCO F5 (23049PCD8G) for 90 FPS gaming.")
          else:
              print("  [FAIL] POCO F5 model spoof not found in build properties!")
              errors += 1

          if safe_device_intact:
              print("  [PASS] Hardware platform & vendor device preserved as 'air' (Camera HAL & thermals safe).")
          else:
              print("  [FAIL] Low-level hardware improperly spoofed to marble! Camera HAL will crash.")
              errors += 1

          # 8. Check Safe Debloat
          print("\n[8] Checking Safe Debloat...")
          trackers = ["product/app/MSA-Global", "product/app/AnalyticsCore", "product/app/MiBugReportOS2Global", "system/app/Traceur"]
          trackers_active = [t for t in trackers if os.path.exists(f"audit_tree/{t}")]
          if not trackers_active:
              print("  [PASS] System tracking telemetry bloatware successfully removed.")
          else:
              print(f"  [WARN] Active bloatware directories remaining: {trackers_active}")
              warnings += 1

          # 9. Check Project Watermark
          print("\n[9] Checking Build Watermark...")
          system_bp = "audit_tree/system/system/build.prop"
          if os.path.exists(system_bp):
              with open(system_bp, "r") as f:
                  if "ro.aero.watermark=AeroHyper_Project" in f.read():
                      print("  [PASS] 'ro.aero.watermark=AeroHyper_Project' present.")
                  else:
                      print("  [WARN] Watermark not found in system/system/build.prop.")
                      warnings += 1

          print("\n==================================================")
          print(f" FINAL AUDIT SUMMARY: {errors} Error(s), {warnings} Warning(s)")
          print("==================================================")

          if errors > 0:
              print("❌ AUDIT FAILED: Required ROM integrity checks did not pass.")
              sys.exit(1)
          else:
              print("✅ ALL CRITICAL SYSTEMS VERIFIED! ROM IS SAFE & READY TO FLASH.")
          EOF
