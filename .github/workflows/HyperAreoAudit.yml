name: 🕵️ HyperOS ROM Auditor

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: "Direct Download Link for the ROM (Google Drive, SourceForge, GitHub)"
        required: true
        default: ""

jobs:
  audit_rom:
    name: "Audit Competitor ROM"
    runs-on: ubuntu-24.04
    steps:
      - name: "🧹 Clean Environment & Install Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar unzip python3 default-jdk
          
          # Install Partition Tools
          wget -q -O lpunpack https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpunpack
          chmod +x lpunpack && sudo mv lpunpack /usr/local/bin/
          
          # Install Payload Dumper Go (for Recovery ROMs)
          wget -q -O payload-dumper.tar.gz https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xf payload-dumper.tar.gz
          chmod +x payload-dumper-go && sudo mv payload-dumper-go /usr/local/bin/
          
          # Install Apktool
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: "📥 Download Target ROM"
        run: |
          echo "Downloading ROM..."
          # Support Google Drive links natively using gdown
          if [[ "${{ github.event.inputs.ROM_URL }}" == *"drive.google.com"* ]]; then
            sudo pip3 install gdown --break-system-packages
            gdown "${{ github.event.inputs.ROM_URL }}" -O target_rom.zip
          else
            wget -q -O target_rom.zip "${{ github.event.inputs.ROM_URL }}"
          fi

      - name: "📦 Extract Firmware Payload"
        run: |
          mkdir -p extracted_rom partitions audit_results
          
          if unzip -l target_rom.zip | grep -q "payload.bin"; then
            echo "Recovery ROM detected. Dumping payload.bin..."
            unzip -q target_rom.zip payload.bin -d extracted_rom/
            payload-dumper-go -p system,product,system_ext,vendor -o partitions extracted_rom/payload.bin
          else
            echo "Fastboot ROM detected. Extracting super.img..."
            mkdir -p temp_fastboot
            tar -xf target_rom.zip -C temp_fastboot 2>/dev/null || unzip -q target_rom.zip -d temp_fastboot
            SUPER_IMG=$(find temp_fastboot -name "super.img" | head -1)
            lpunpack "$SUPER_IMG" partitions/
          fi
          
          echo "Extracting EROFS Partitions..."
          mkdir -p tree/system tree/product tree/vendor tree/system_ext
          for part in system product vendor system_ext; do
            IMG=$(find partitions -iname "*${part}*.img" | head -1)
            if [ -n "$IMG" ]; then
              sudo fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: "🔎 Audit Phase 1: Build Props & Spoofing"
        run: |
          mkdir -p audit_results/props
          echo "Collecting build.prop files..."
          for prop in tree/product/etc/build.prop tree/system/system/build.prop tree/system_ext/etc/build.prop tree/vendor/build.prop; do
            if [ -f "$prop" ]; then
              PART_NAME=$(echo "$prop" | cut -d'/' -f2)
              cp "$prop" "audit_results/props/${PART_NAME}_build.prop"
            fi
          done
          
          echo "Generating Spoof Report..."
          grep -E "ro.product.model|ro.product.brand|ro.build.characteristics" audit_results/props/* > audit_results/spoof_report.txt || true

      - name: "🔎 Audit Phase 2: Feature XMLs"
        run: |
          mkdir -p audit_results/xmls
          echo "Collecting device feature XMLs..."
          find tree/product tree/system -type f -name "*.xml" | grep "device_features" | while read -r file; do
            cp "$file" "audit_results/xmls/$(basename "$file")"
          done
          
          find tree/product tree/system -type f -name "*.xml" | grep "sysconfig" | grep -i "pixel" | while read -r file; do
            cp "$file" "audit_results/xmls/$(basename "$file")"
          done

      - name: "🔎 Audit Phase 3: Services.jar (Core Patch Logic)"
        run: |
          mkdir -p audit_results/core_patch
          JAR_PATH=$(find tree/system -name "services.jar" | head -1)
          
          if [ -n "$JAR_PATH" ]; then
            echo "Decompiling services.jar..."
            java -jar apktool.jar d -q "$JAR_PATH" -o decompiled_services
            
            echo "Hunting for compareSignatures..."
            TARGET_SMALI=$(find decompiled_services -type f -name "*.smali" | xargs grep -l "compareSignatures" | head -1)
            
            if [ -n "$TARGET_SMALI" ]; then
              echo "Found signature logic at: $TARGET_SMALI"
              cp "$TARGET_SMALI" audit_results/core_patch/compareSignatures_logic.smali
            else
              echo "compareSignatures not found. They might be using a different bypass method." > audit_results/core_patch/not_found.txt
            fi
          else
            echo "services.jar not found."
          fi

      - name: "📦 Upload Audit Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: EiaxoOS_Audit_Report
          path: audit_results/
          retention-days: 7
