name: 🚀 Build AeroHyper 2.0 (Ultimate Edition)

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"
  LAUNCHER_URL: "https://github.com/Mods-Center/HyperOS-Launcher/releases/download/V6.2/HyperOS_LauncherV6.2%40kashis_cringey_stuffs.zip"
  SECURITY_URL: "https://github.com/Mods-Center/HyperOS-Security-Center/releases/download/V5/v5HyperOS_SecurityCenter%40kashis_cringey_stuffs.zip"
  AOD_URL: "https://github.com/Mods-Center/HyperOS-AOD/releases/download/V2/HyperOS_AOD_V2%40kashis_cringey_stuffs.zip"
  THEME_URL: "https://github.com/Mods-Center/HyperOS-Theme-Manager/releases/download/theme-manager-v4/HyperOS_ThemeManagerV4%40kashis_cringey_stuffs.zip"
  VAULT_URL: "https://github.com/Mods-Center/HyperOS-App-Vault/releases/download/V4/HyperOS_AppVaultV4%40kashis_cringey_stuffs.zip"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_package:
    name: "Compile AeroHyper 2.0"
    runs-on: ubuntu-24.04
    steps:
      - name: "🧹 Clean Environment & Install Toolchain"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar unzip android-sdk-libsparse-utils default-jdk python3 zip
          
          echo "📥 Downloading Partition Tools..."
          wget -q -O lpunpack https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpunpack || wget -q -O lpunpack https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/main/binary/lpunpack
          wget -q -O lpmake https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpmake || wget -q -O lpmake https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/main/binary/lpmake
          chmod +x lpunpack lpmake
          sudo mv lpunpack lpmake /usr/local/bin/

      - name: "📥 Extract Stock Fastboot ROM & Firmwares"
        run: |
          wget -q -O stock_rom.tgz "$ROM_URL"
          mkdir -p stock_extracted super_unpacked package_root/firmware-update package_root/bin/windows package_root/bin/linux
          tar -xf stock_rom.tgz -C stock_extracted
          
          IMAGES_DIR=$(find stock_extracted -type d -name "images" | head -1)
          
          for img in boot.img init_boot.img vendor_boot.img dtbo.img vbmeta.img; do
            cp -f "$IMAGES_DIR/$img" package_root/firmware-update/ 2>/dev/null || true
          done
          
          rm -f package_root/firmware-update/preloader*.bin package_root/firmware-update/preloader*.img 2>/dev/null || true
          
          SUPER="$IMAGES_DIR/super.img"
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_TARGET="super_raw.img"
          else
            SUPER_TARGET="$SUPER"
          fi
          
          lpunpack "$SUPER_TARGET" super_unpacked
          
          mkdir -p tree/system tree/system_ext tree/product tree/vendor tree/mi_ext
          for part in system system_ext product mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              sudo fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: "📦 Extract Kashi Modules"
        run: |
          mkdir -p mods mods_extracted
          wget -q -O mods/launcher.zip "$LAUNCHER_URL"
          wget -q -O mods/security.zip "$SECURITY_URL"
          wget -q -O mods/aod.zip "$AOD_URL"
          wget -q -O mods/theme.zip "$THEME_URL"
          wget -q -O mods/vault.zip "$VAULT_URL"
          for z in launcher security aod theme vault; do
            unzip -q "mods/$z.zip" -d "mods_extracted/$z"
          done

      - name: "🧹 Target Safe Debloat & App Injection"
        run: |
          for path in "product/app/MSA-Global" "product/app/AnalyticsCore" "product/app/MiBugReportOS2Global" "system/app/Traceur"; do
            if [ -d "tree/$path" ]; then sudo rm -rf "tree/$path"; fi
          done

          purge_art() {
            sudo find "$1" -type f \( -name "*.odex" -o -name "*.vdex" -o -name "*.art" \) -delete 2>/dev/null || true
          }

          if [ -f "mods_extracted/launcher/files/MiuiHome.apk" ]; then
            sudo cp mods_extracted/launcher/files/MiuiHome.apk tree/product/priv-app/MiuiHome/MiuiHome.apk
            purge_art "tree/product/priv-app/MiuiHome"
          fi
          
          if [ -f "mods_extracted/security/files/SecurityCenter.apk" ]; then
            sudo cp mods_extracted/security/files/SecurityCenter.apk tree/product/priv-app/MIUISecurityCenterGlobal/MIUISecurityCenterGlobal.apk
            purge_art "tree/product/priv-app/MIUISecurityCenterGlobal"
          fi
          
          if [ -f "mods_extracted/aod/files/MIUIAod.apk" ]; then
            sudo cp mods_extracted/aod/files/MIUIAod.apk tree/product/priv-app/MIUIAod/MIUIAod.apk
            purge_art "tree/product/priv-app/MIUIAod"
          fi
          
          if [ -f "mods_extracted/theme/files/MIUIThemeManager.apk" ]; then
            sudo cp mods_extracted/theme/files/MIUIThemeManager.apk tree/product/app/MIUIThemeManagerGlobal/MIUIThemeManagerGlobal.apk
            purge_art "tree/product/app/MIUIThemeManagerGlobal"
            if [ -d "mods_extracted/theme/files/lib/arm64" ]; then
              sudo mkdir -p tree/product/app/MIUIThemeManagerGlobal/lib/arm64
              sudo cp mods_extracted/theme/files/lib/arm64/*.so tree/product/app/MIUIThemeManagerGlobal/lib/arm64/ 2>/dev/null || true
              sudo chmod 644 tree/product/app/MIUIThemeManagerGlobal/lib/arm64/*.so 2>/dev/null || true
            fi
          fi
          
          VAULT_TARGET=$(find tree/mi_ext \( -iname "*MinusScreen*" -o -iname "*AppVault*" \) -type d 2>/dev/null | head -1)
          if [ -n "$VAULT_TARGET" ] && [ -f "mods_extracted/vault/files/AppVault.apk" ]; then
            sudo cp mods_extracted/vault/files/AppVault.apk "$VAULT_TARGET/$(basename "$VAULT_TARGET").apk"
            purge_art "$VAULT_TARGET"
          fi

      - name: "🔓 Core Signature Patch (Native Apktool)"
        run: |
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          sudo java -jar apktool.jar d -q tree/system/system/framework/services.jar -o jar_workspace
          
          sudo python3 - << 'EOF'
          import os, re
          patched = False
          for root, dirs, files in os.walk("jar_workspace"):
              for file in files:
                  if file.endswith(".smali"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f: content = f.read()
                      if "compareSignatures" in content and "([Landroid/content/pm/Signature;[Landroid/content/pm/Signature;)I" in content:
                          pattern = r"(\.method [^\n]*compareSignatures\(\[Landroid/content/pm/Signature;\[Landroid/content/pm/Signature;\)I\s+)([\s\S]*?)(\.end method)"
                          replacement = r"\1    .registers 3\n    const/4 v0, 0x0\n    return v0\n\3"
                          content = re.sub(pattern, replacement, content)
                          with open(path, "w", encoding="utf-8") as f: f.write(content)
                          patched = True
          if not patched: raise SystemExit("Error: signature bypass target not found in services.jar!")
          EOF
          
          sudo java -jar apktool.jar b -q jar_workspace -c -o tree/system/system/framework/services.jar

      - name: "✨ UI Flags & Targeted Hardware-Safe Spoofing"
        run: |
          AIR_XML=$(sudo find tree/product -iname "air.xml" 2>/dev/null | head -1)
          if [ -n "$AIR_XML" ]; then
            sudo sed -i 's/<bool name="support_window_blur">false<\/bool>/<bool name="support_window_blur">true<\/bool>/g' "$AIR_XML"
            sudo sed -i 's/<bool name="support_new_control_center">false<\/bool>/<bool name="support_new_control_center">true<\/bool>/g' "$AIR_XML"
          fi
          
          for prop in tree/product/etc/build.prop tree/system/system/build.prop tree/system_ext/etc/build.prop; do
            if [ -f "$prop" ]; then
              sudo sed -i 's/ro.product.model=.*/ro.product.model=23049PCD8G/g' "$prop"
              sudo sed -i 's/ro.product.brand=.*/ro.product.brand=POCO/g' "$prop"
              sudo sed -i 's/ro.product.name=.*/ro.product.name=marble/g' "$prop"
            fi
          done

          PIXEL_XML="tree/product/etc/sysconfig/pixel_unlimited.xml"
          sudo mkdir -p tree/product/etc/sysconfig
          sudo bash -c "cat > $PIXEL_XML" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_PRELOAD" />
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_STORAGE" />
              <feature name="com.google.android.feature.PIXEL_2021_MIDYEAR_EXPERIENCE" />
          </config>
          EOF
          sudo chmod 644 "$PIXEL_XML"
          
          sudo sed -i '$ a ro.aero.watermark=AeroHyper_Project' tree/system/system/build.prop

      - name: "💾 Compile EROFS & Flawless LP Metadata Super Repack"
        run: |
          mkdir -p output
          
          SYS_CTX=$(find tree/system -name "plat_file_contexts" | head -1)
          PROD_CTX=$(find tree/product -name "product_file_contexts" | head -1)
          EXT_CTX=$(find tree/system_ext -name "system_ext_file_contexts" | head -1)
          
          [ -n "$SYS_CTX" ] && sudo mkfs.erofs -zlz4hc --file-contexts="$SYS_CTX" output/system.img tree/system
          [ -n "$PROD_CTX" ] && sudo mkfs.erofs -zlz4hc --file-contexts="$PROD_CTX" output/product.img tree/product
          [ -n "$EXT_CTX" ] && sudo mkfs.erofs -zlz4hc --file-contexts="$EXT_CTX" output/system_ext.img tree/system_ext
          sudo mkfs.erofs -zlz4hc output/mi_ext.img tree/mi_ext
          sudo chown -R $USER:$USER output/
          
          sudo python3 - << 'EOF'
          import os, shlex
          
          super_size = os.path.getsize("super_raw.img")
          
          with open("super_raw.img", "rb") as f:
              header_data = f.read(1048576)
          
          # Native Group Detection
          group_name = "main_a"
          for known_group in [b"qti_dynamic_partitions_a", b"main_a", b"google_dynamic_partitions_a"]:
              if known_group in header_data:
                  group_name = known_group.decode()
                  break
                  
          partitions = ["system_a", "system_ext_a", "product_a", "vendor_a", "odm_a", "mi_ext_a", "system_dlkm_a", "vendor_dlkm_a", "odm_dlkm_a"]
          
          lpmake_cmd = [
              "lpmake",
              "--metadata-size", "65536",
              "--super-name", "super",
              "--metadata-slots", "2",
              "--device", f"super:{super_size}"
          ]
          
          total_size = 0
          for p_name in partitions:
              base_name = p_name.replace("_a", "")
              src_img = f"output/{base_name}.img" if os.path.exists(f"output/{base_name}.img") else f"super_unpacked/{p_name}.img"
                  
              if os.path.exists(src_img):
                  size = os.path.getsize(src_img)
                  total_size += size
                  lpmake_cmd.extend(["--partition", f"{p_name}:readonly:{size}:{group_name}", "--image", f"{p_name}={src_img}"])
          
          group_size = total_size + 15728640 # Add 15MB headroom
          lpmake_cmd.extend(["--group", f"{group_name}:{group_size}"])
          lpmake_cmd.extend(["--sparse", "--output", "package_root/firmware-update/super.img"])
          
          with open("repack.sh", "w") as f:
              f.write("#!/bin/bash\n" + shlex.join(lpmake_cmd) + "\n")
          EOF
          
          chmod +x repack.sh
          ./repack.sh

      - name: "📜 Inject Clean Flash & VBMeta Neutralization Scripts"
        run: |
          wget -q https://dl.google.com/android/repository/platform-tools-latest-windows.zip -O pt_win.zip
          unzip -q pt_win.zip
          cp platform-tools/fastboot.exe package_root/bin/windows/
          cp platform-tools/AdbWinApi.dll package_root/bin/windows/
          cp platform-tools/AdbWinUsbApi.dll package_root/bin/windows/
          rm -rf platform-tools pt_win.zip

          wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip -O pt_linux.zip
          unzip -q pt_linux.zip
          cp platform-tools/fastboot package_root/bin/linux/
          chmod +x package_root/bin/linux/fastboot
          rm -rf platform-tools pt_linux.zip

          cat << 'EOF' > package_root/windows_clean_install.bat
          @echo off
          cd /d "%~dp0"
          set "fastboot=bin\windows\fastboot.exe"
          if not exist "%fastboot%" echo [ERROR] Fastboot missing. & pause & exit /B 1
          
          echo Waiting for device in Fastboot mode...
          "%fastboot%" getvar product >nul 2>nul
          if %errorlevel% neq 0 (
              echo [ERROR] Device not detected! Install Fastboot drivers.
              pause
              exit /B 1
          )

          echo ===================================================
          echo    AeroHyper 2.0 Clean Flash (Wipes Data)
          echo ===================================================
          
          for %%p in (boot init_boot vendor_boot dtbo) do (
              if exist "firmware-update\%%p.img" (
                  echo Flashing %%p...
                  "%fastboot%" flash %%p "firmware-update\%%p.img"
                  if %errorlevel% neq 0 echo [ERROR] %%p flash failed. Halting. & pause & exit /B 1
              )
          )

          if exist "firmware-update\vbmeta.img" (
              echo Disabling Android Verified Boot...
              "%fastboot%" --disable-verity --disable-verification flash vbmeta "firmware-update\vbmeta.img"
              if %errorlevel% neq 0 echo [ERROR] VBMeta flash failed. Halting. & pause & exit /B 1
          )

          echo Flashing Super Partition (This will take a few minutes)...
          "%fastboot%" flash super "firmware-update\super.img"
          if %errorlevel% neq 0 echo [ERROR] Super flash failed! & pause & exit /B 1

          echo Erasing Data for a Clean Install...
          "%fastboot%" erase userdata
          "%fastboot%" erase metadata

          echo ---------------------------------------------------
          echo Flash complete! Rebooting device...
          echo ---------------------------------------------------
          "%fastboot%" reboot
          pause
          EOF

          cat << 'EOF' > package_root/linux_clean_install.sh
          #!/bin/bash
          cd "$(dirname "$0")" || exit 1
          fastboot="bin/linux/fastboot"
          chmod +x "$fastboot"
          
          echo "Waiting for device..."
          if ! "$fastboot" getvar product >/dev/null 2>&1; then echo "[ERROR] Device not detected!"; exit 1; fi
          
          for p in boot init_boot vendor_boot dtbo; do
              if [ -f "firmware-update/$p.img" ]; then
                  echo "Flashing $p..."
                  "$fastboot" flash "$p" "firmware-update/$p.img" \vert{}\vert{} { echo "[ERROR] $p flash failed."; exit 1; }
              fi
          done

          if [ -f "firmware-update/vbmeta.img" ]; then
              echo "Disabling Android Verified Boot..."
              "$fastboot" --disable-verity --disable-verification flash vbmeta "firmware-update/vbmeta.img" || { echo "[ERROR] VBMeta flash failed."; exit 1; }
          fi

          echo "Flashing Super Partition (This will take a few minutes)..."
          "$fastboot" flash super "firmware-update/super.img" || { echo "[ERROR] Super flash failed!"; exit 1; }

          echo "Erasing Data for a Clean Install..."
          "$fastboot" erase userdata
          "$fastboot" erase metadata

          echo "Flash complete! Rebooting..."
          "$fastboot" reboot
          EOF
          chmod +x package_root/linux_clean_install.sh

      - name: "📦 Compress & Publish Clean-Flash ZIP"
        run: |
          cd package_root
          zip -r -1 ../AeroHyper_2.0_Air_Fastboot.zip ./*
          echo "RELEASE_TAG=v2.0-$(date +\%Y\%m\%d\%H\%M)" >> $GITHUB_ENV

      - name: "🚀 Push to GitHub Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "AeroHyper 2.0 (Ultimate Edition) - Clean Flash"
          body: |
            ## 🚀 AeroHyper 2.0 (Clean Flash Build)
            Fully featured, dynamically patched HyperOS build for Redmi 13C 5G / POCO M6 5G (`air`).
            
            ### ✨ Features
            *   **Targeted 90 FPS Gaming Spoofing:** Spoofs UI model to unlock high FPS targets while safely keeping the core `air` camera HALs and thermal drivers perfectly intact.
            *   **Unlimited Google Photos:** Pixel sysconfig XML injected.
            *   **Real-Time Control Center Blur:** Native Gaussian blur forced via `air.xml`.
            *   **Kashi Modules Injected:** Launcher, Security, AOD, and Theme Manager fully pre-installed with clean ART caches.
            *   **Isolated Signature Bypass:** Native `services.jar` bytecode patched to bypass `compareSignatures`, ensuring seamless installation of modded system apps.
            *   **Automated Clean Flash:** The installation batch file automatically wipes `userdata` and `metadata` to prevent dirty-flash bootloops.
          files: AeroHyper_2.0_Air_Fastboot.zip
          draft: false
          prerelease: false
