name: 🚀 Build & Release AeroHyper 2.0 Custom ROM

on:
  workflow_dispatch:

env:
  ROM_URL: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz"
  LAUNCHER_URL: "https://github.com/Mods-Center/HyperOS-Launcher/releases/download/V6.2/HyperOS_LauncherV6.2%40kashis_cringey_stuffs.zip"
  SECURITY_URL: "https://github.com/Mods-Center/HyperOS-Security-Center/releases/download/V5/v5HyperOS_SecurityCenter%40kashis_cringey_stuffs.zip"
  AOD_URL: "https://github.com/Mods-Center/HyperOS-AOD/releases/download/V2/HyperOS_AOD_V2%40kashis_cringey_stuffs.zip"
  THEME_URL: "https://github.com/Mods-Center/HyperOS-Theme-Manager/releases/download/theme-manager-v4/HyperOS_ThemeManagerV4%40kashis_cringey_stuffs.zip"
  VAULT_URL: "https://github.com/Mods-Center/HyperOS-App-Vault/releases/download/V4/HyperOS_AppVaultV4%40kashis_cringey_stuffs.zip"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_package:
    name: "Compile & Publish Custom ROM"
    runs-on: ubuntu-24.04
    steps:
      - name: "🧹 Clean Environment & Install Toolchain"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y erofs-utils wget tar unzip android-sdk-libsparse-utils default-jdk python3 zip
          
          echo "📥 Downloading Partition Tools..."
          wget -q -O lpunpack https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpunpack || wget -q -O lpunpack https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpunpack
          wget -q -O lpmake https://raw.githubusercontent.com/Exynos-nibba/lpunpack-lpmake-mirror/d0f9da322b764871e54072d1b3e9d67c09cd715c/binary/lpmake || wget -q -O lpmake https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpmake
          chmod +x lpunpack lpmake
          sudo mv lpunpack lpmake /usr/local/bin/
          
          echo "📥 Downloading AVBTool..."
          wget -q -O avbtool https://raw.githubusercontent.com/aosp-mirror/platform_external_avb/main/avbtool || wget -q -O avbtool https://raw.githubusercontent.com/LineageOS/android_external_avb/lineage-21.0/avbtool.py
          chmod +x avbtool
          sudo mv avbtool /usr/local/bin/

      - name: "📥 Extract Stock Fastboot ROM & Firmwares"
        run: |
          wget -q -O stock_rom.tgz "$ROM_URL"
          mkdir -p stock_extracted super_unpacked package_root/firmware-update package_root/bin/windows package_root/bin/linux
          tar -xf stock_rom.tgz -C stock_extracted
          
          IMAGES_DIR=$(find stock_extracted -type d -name "images" | head -1)
          
          cp -f $IMAGES_DIR/*.img package_root/firmware-update/ 2>/dev/null || true
          cp -f $IMAGES_DIR/*.bin package_root/firmware-update/ 2>/dev/null || true
          
          # CRITICAL PROTECTION: Delete preloader entirely to protect Eng Preloader and BROM access
          rm -f package_root/firmware-update/preloader*.bin package_root/firmware-update/preloader*.img 2>/dev/null || true
          
          SUPER="$IMAGES_DIR/super.img"
          if file "$SUPER" | grep -qi "sparse"; then
            simg2img "$SUPER" super_raw.img
            SUPER_TARGET="super_raw.img"
          else
            SUPER_TARGET="$SUPER"
          fi
          lpunpack "$SUPER_TARGET" super_unpacked
          
          mkdir -p tree/system tree/system_ext tree/product tree/vendor tree/mi_ext
          for part in system system_ext product vendor mi_ext; do
            IMG=$(find super_unpacked -iname "${part}_a.img" | head -1)
            if [ -n "$IMG" ]; then
              sudo fsck.erofs --extract="tree/$part" "$IMG"
            fi
          done

      - name: "📦 Extract Mods & Modules"
        run: |
          mkdir -p mods mods_extracted
          wget -q -O mods/launcher.zip "$LAUNCHER_URL"
          wget -q -O mods/security.zip "$SECURITY_URL"
          wget -q -O mods/aod.zip "$AOD_URL"
          wget -q -O mods/theme.zip "$THEME_URL"
          wget -q -O mods/vault.zip "$VAULT_URL"
          for z in launcher security aod theme vault; do
            unzip -q "mods/$z.zip" -d "mods_extracted/$z"
          done

      - name: "🧹 Verified Debloat"
        run: |
          for path in \
            "product/app/MSA-Global" "product/app/AnalyticsCore" "system_ext/app/MiSightService" \
            "product/app/MiBugReportOS2Global" "mi_ext/app/MIUIMiPicks" "mi_ext/app/GameCenterGlobal" \
            "system/app/Traceur" "product/app/facebook-appmanager" "product/priv-app/facebook-installer" \
            "product/priv-app/facebook-services" "product/app/Longcheer_GFTest" "product/app/Longcheer_SensorTestTool" \
            "product/app/Longcheer_factoryTest" "product/app/Longcheer_sileadManager" "product/app/AutoTest" \
            "product/app/cit" "system_ext/app/DebugLoggerUI" "system_ext/app/EngineerMode" \
            "system_ext/app/ModemTestBox" "system_ext/app/ATMWifiMeta" "system_ext/app/YGPS" \
            "product/app/Drive" "product/app/Meet" "product/app/YTMusic"
          do
            if [ -d "tree/$path" ]; then
              echo "🗑️ Removing bloatware: $path"
              sudo rm -rf "tree/$path"
            fi
          done

      - name: "🔄 Replace Apps & Purge ART Bytecode Caches"
        run: |
          sudo cp mods_extracted/launcher/files/MiuiHome.apk tree/product/priv-app/MiuiHome/MiuiHome.apk
          sudo rm -rf tree/product/priv-app/MiuiHome/oat tree/product/priv-app/MiuiHome/arm64 tree/product/priv-app/MiLauncherGlobal 2>/dev/null || true
          if [ -f "mods_extracted/launcher/system/product/overlay/MiuiHomeLauncherResOverlay.apk" ]; then
            sudo mkdir -p tree/product/overlay
            sudo cp mods_extracted/launcher/system/product/overlay/MiuiHomeLauncherResOverlay.apk tree/product/overlay/
          fi
          
          sudo cp mods_extracted/security/files/SecurityCenter.apk tree/product/priv-app/MIUISecurityCenterGlobal/MIUISecurityCenterGlobal.apk
          sudo rm -rf tree/product/priv-app/MIUISecurityCenterGlobal/oat tree/product/priv-app/MIUISecurityCenterGlobal/arm64 2>/dev/null || true
          
          sudo cp mods_extracted/aod/files/MIUIAod.apk tree/product/priv-app/MIUIAod/MIUIAod.apk
          sudo rm -rf tree/product/priv-app/MIUIAod/oat tree/product/priv-app/MIUIAod/arm64 2>/dev/null || true
          
          sudo cp mods_extracted/theme/files/MIUIThemeManager.apk tree/product/app/MIUIThemeManagerGlobal/MIUIThemeManagerGlobal.apk
          sudo rm -rf tree/product/app/MIUIThemeManagerGlobal/oat tree/product/app/MIUIThemeManagerGlobal/arm64 2>/dev/null || true
          if [ -d "mods_extracted/theme/files/lib/arm64" ]; then
            sudo mkdir -p tree/product/app/MIUIThemeManagerGlobal/lib/arm64
            sudo cp mods_extracted/theme/files/lib/arm64/*.so tree/product/app/MIUIThemeManagerGlobal/lib/arm64/ 2>/dev/null || true
            sudo chmod 644 tree/product/app/MIUIThemeManagerGlobal/lib/arm64/*.so 2>/dev/null || true
          fi
          
          VAULT_TARGET=$(find tree/mi_ext -iname "*MinusScreen*" -o -iname "*AppVault*" -type d | head -1)
          if [ -n "$VAULT_TARGET" ]; then
            sudo cp mods_extracted/vault/files/AppVault.apk "$VAULT_TARGET/$(basename "$VAULT_TARGET").apk"
            sudo rm -rf "$VAULT_TARGET/oat" "$VAULT_TARGET/arm64" 2>/dev/null || true
          fi

      - name: "🔓 Multi-Dex Core Patch (Apktool Architecture)"
        run: |
          echo "📥 Downloading Apktool (Official GitHub Release)..."
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          
          echo "📦 Decompiling services.jar..."
          sudo java -jar apktool.jar d -q tree/system/system/framework/services.jar -o jar_workspace
          
          echo "⚙️ Injecting Signature Bypass Hook..."
          sudo python3 - << 'EOF'
          import os, re
          patched = False
          for root, dirs, files in os.walk("jar_workspace"):
              for file in files:
                  if file.endswith(".smali"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f: content = f.read()
                      if "compareSignatures" in content and "([Landroid/content/pm/Signature;[Landroid/content/pm/Signature;)I" in content:
                          pattern = r"(\.method public static compareSignatures\(\[Landroid/content/pm/Signature;\[Landroid/content/pm/Signature;\)I\s+)([\s\S]*?)(\.end method)"
                          replacement = r"\1    .registers 3\n    const/4 v0, 0x0\n    return v0\n\3"
                          content = re.sub(pattern, replacement, content)
                          with open(path, "w", encoding="utf-8") as f: f.write(content)
                          patched = True
          if not patched: raise SystemExit("Error: signature bypass target not found in services.jar!")
          EOF
          
          echo "💾 Recompiling Patched services.jar..."
          sudo java -jar apktool.jar b -q jar_workspace -c -o tree/system/system/framework/services.jar

      - name: "✨ Force Enable HyperOS 2 Blur & Animation Engines"
        run: |
          AIR_XML=$(find tree/product -iname "air.xml" | head -1)
          if [ -n "$AIR_XML" ]; then
            sudo sed -i 's/<bool name="support_window_blur">false<\/bool>/<bool name="support_window_blur">true<\/bool>/g' "$AIR_XML"
            sudo sed -i 's/<bool name="support_new_control_center">false<\/bool>/<bool name="support_new_control_center">true<\/bool>/g' "$AIR_XML"
            sudo sed -i 's/<bool name="is_low_end_device">true<\/bool>/<bool name="is_low_end_device">false<\/bool>/g' "$AIR_XML"
          fi
          find tree -iname "*build.prop" -not -path "*/vendor/*" -exec sudo sed -i 's/ro.config.low_ram=true/ro.config.low_ram=false/g' {} +
          find tree -iname "*build.prop" -not -path "*/vendor/*" -exec sudo sed -i 's/ro.config.low_ram.threshold_gb=99/ro.config.low_ram.threshold_gb=0/g' {} +

      - name: "🎭 Device Spoofing (POCO F5 90 FPS + Pixel Photos)"
        run: |
          for prop in tree/product/etc/build.prop tree/system/system/build.prop tree/system_ext/etc/build.prop; do
            if [ -f "$prop" ]; then
              sudo sed -i 's/ro.product.model=.*/ro.product.model=23049PCD8G/g' "$prop"
              sudo sed -i 's/ro.product.brand=.*/ro.product.brand=POCO/g' "$prop"
              sudo sed -i 's/ro.product.name=.*/ro.product.name=marble/g' "$prop"
              sudo sed -i 's/ro.product.device=.*/ro.product.device=marble/g' "$prop"
              sudo sed -i 's/ro.product.marketname=.*/ro.product.marketname=POCO F5/g' "$prop"
            fi
          done
          PIXEL_XML="tree/product/etc/sysconfig/pixel_unlimited.xml"
          sudo mkdir -p tree/product/etc/sysconfig
          sudo bash -c "cat > $PIXEL_XML" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_PRELOAD" />
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_STORAGE" />
              <feature name="com.google.android.feature.PIXEL_2021_MIDYEAR_EXPERIENCE" />
          </config>
          EOF
          sudo chmod 644 "$PIXEL_XML"

      - name: "🛡️ Generate AVB Neutralized VBMeta"
        run: |
          avbtool make_vbmeta_image --flags 3 --padding_size 4096 --output package_root/firmware-update/vbmeta.img
          cp package_root/firmware-update/vbmeta.img package_root/firmware-update/vbmeta_system.img
          cp package_root/firmware-update/vbmeta.img package_root/firmware-update/vbmeta_vendor.img

      - name: "💾 Compile EROFS Partitions & Repack Monolithic Super"
        run: |
          mkdir -p output
          cat tree/system/system/etc/selinux/*file_contexts* 2>/dev/null > all_contexts.txt || true
          cat tree/product/etc/selinux/*file_contexts* 2>/dev/null >> all_contexts.txt || true
          cat tree/system_ext/etc/selinux/*file_contexts* 2>/dev/null >> all_contexts.txt || true
          cat tree/vendor/etc/selinux/*file_contexts* 2>/dev/null >> all_contexts.txt || true
          
          sudo mkfs.erofs -zlz4hc --file-contexts=all_contexts.txt output/product.img tree/product
          sudo mkfs.erofs -zlz4hc --file-contexts=all_contexts.txt output/system.img tree/system
          sudo mkfs.erofs -zlz4hc --file-contexts=all_contexts.txt output/system_ext.img tree/system_ext
          sudo mkfs.erofs -zlz4hc --file-contexts=all_contexts.txt output/mi_ext.img tree/mi_ext
          sudo chown -R $USER:$USER output/
          
          python3 - << 'EOF'
          import subprocess, re, sys
          raw_img = "super_raw.img"
          with open(raw_img, "rb") as f: header_data = f.read(1048576)
          matches = re.findall(b'([a-zA-Z0-9_]+_dynamic_partitions_a|[a-zA-Z0-9_]+_a|default)', header_data)
          group_name = "main_a"
          for m in matches:
              name = m.decode('ascii', errors='ignore')
              if "_a" in name and "qti" not in name:
                  group_name = name; break
          stat_size = subprocess.check_output(["stat", "-c%s", raw_img]).decode().strip()
          with open("metadata_params.sh", "w") as out:
              out.write(f'export DETECTED_SUPER_SIZE={stat_size}\nexport DETECTED_GROUP_NAME="{group_name}"\n')
          EOF
          
          source metadata_params.sh
          LPMAKE_ARGS="--metadata-size 65536 --super-name super --metadata-slots 2 --device super:$DETECTED_SUPER_SIZE"
          TOTAL_SIZE=0
          PART_ARGS=""
          
          for img_path in super_unpacked/*_a.img; do
            filename=$(basename "$img_path")
            part_name="${filename%.img}"
            if [ -f "output/${part_name\%_a}.img" ]; then src_img="output/${part_name%_a}.img"
            else src_img="$img_path"; fi
            size=$(stat -c\%s "$src_img")
            TOTAL_SIZE=$((TOTAL_SIZE + size))
            PART_ARGS="$PART_ARGS --partition$part_name:readonly:$size:$DETECTED_GROUP_NAME --image $part_name=$src_img"
          done
          
          GROUP_SIZE=$((TOTAL_SIZE + 15728640))
          LPMAKE_ARGS="$LPMAKE_ARGS --group$DETECTED_GROUP_NAME:$GROUP_SIZE$PART_ARGS --sparse --output package_root/firmware-update/super.img"
          lpmake $LPMAKE_ARGS

      - name: "📜 Inject Dual-Slot Bulletproof Flash Scripts"
        run: |
          wget -q https://dl.google.com/android/repository/platform-tools-latest-windows.zip -O pt_win.zip
          unzip -q pt_win.zip
          cp platform-tools/fastboot.exe package_root/bin/windows/
          cp platform-tools/AdbWinApi.dll package_root/bin/windows/
          cp platform-tools/AdbWinUsbApi.dll package_root/bin/windows/
          rm -rf platform-tools pt_win.zip

          wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip -O pt_linux.zip
          unzip -q pt_linux.zip
          cp platform-tools/fastboot package_root/bin/linux/
          chmod +x package_root/bin/linux/fastboot
          rm -rf platform-tools pt_linux.zip

          cat << 'EOF' > package_root/windows_fastboot_install.bat
          @echo off
          cd /d "%~dp0"
          set "fastboot=bin\windows\fastboot.exe"
          if not exist "%fastboot%" echo [ERROR] Fastboot missing. & pause & exit /B 1
          echo Waiting for device in Fastboot mode...
          "%fastboot%" getvar product >nul 2>nul
          if %errorlevel% neq 0 (
              echo [ERROR] Device not detected! Install Fastboot drivers.
              pause
              exit /B 1
          )
          for /f "tokens=2" %%D in ('"%fastboot%" getvar product 2^>^&1 ^| findstr /l /b /c:"product:"') do set device=%%D
          if /i "%device%" neq "air" if /i "%device%" neq "atmos" (
              echo [ERROR] Incompatible device: %device%. ROM strictly for air/atmos.
              pause
              exit /B 1
          )
          echo ===================================================
          echo       AeroHyper 2.0 Custom Flash - Redmi 13C 5G
          echo ===================================================
          "%fastboot%" set_active a
          for %%p in (boot connsys_bt countrycode dpm dtbo gz init_boot lk logo mcf_ota mcupm md1img pi_img scp spmfw sspm tee vbmeta vbmeta_system vbmeta_vendor vcp vendor_boot) do (
              if exist "firmware-update\%%p.img" (
                  "%fastboot%" flash %%p_a "firmware-update\%%p.img"
                  "%fastboot%" flash %%p_b "firmware-update\%%p.img"
              )
          )
          if exist "firmware-update\cust.img" "%fastboot%" flash cust "firmware-update\cust.img"
          echo Flashing Super Partition...
          "%fastboot%" flash super "firmware-update\super.img"
          if %errorlevel% neq 0 (
              echo [ERROR] Super partition failed! Halting to protect data.
              pause
              exit /B 1
          )
          "%fastboot%" erase metadata
          "%fastboot%" erase userdata
          "%fastboot%" erase expdb
          "%fastboot%" oem cdms
          echo ---------------------------------------------------
          echo Flash complete! Rebooting device...
          "%fastboot%" reboot
          pause
          EOF

          cat << 'EOF' > package_root/linux_fastboot_install.sh
          #!/bin/bash
          cd "$(dirname "$0")" || exit 1
          fastboot="bin/linux/fastboot"
          chmod +x "$fastboot"
          echo "Waiting for device..."
          if ! "$fastboot" getvar product >/dev/null 2>&1; then echo "[ERROR] Device not detected!"; exit 1; fi
          device=$("$fastboot" getvar product 2>&1 | grep -F "product:" | awk '{print $2}')
          if [ "$device" != "air" ] && [ "$device" != "atmos" ]; then echo "[ERROR] Incompatible: $device"; exit 1; fi
          "$fastboot" set_active a
          for p in boot connsys_bt countrycode dpm dtbo gz init_boot lk logo mcf_ota mcupm md1img pi_img scp spmfw sspm tee vbmeta vbmeta_system vbmeta_vendor vcp vendor_boot; do
              if [ -f "firmware-update/$p.img" ]; then
                  "$fastboot" flash ${p}_a "firmware-update/$p.img"
                  "$fastboot" flash ${p}_b "firmware-update/$p.img"
              fi
          done
          [ -f "firmware-update/cust.img" ] && "$fastboot" flash cust "firmware-update/cust.img"
          if ! "$fastboot" flash super "firmware-update/super.img"; then echo "[ERROR] Super failed!"; exit 1; fi
          "$fastboot" erase metadata
          "$fastboot" erase userdata
          "$fastboot" erase expdb
          "$fastboot" oem cdms
          "$fastboot" reboot
          echo "Finished! Rebooting..."
          EOF
          chmod +x package_root/linux_fastboot_install.sh

      - name: "📦 Compress Flashable Distribution ZIP"
        run: |
          cd package_root
          zip -r -1 ../AeroHyper_2.0_Air_Fastboot.zip ./*

      - name: "🏷️ Generate Release Tag"
        run: echo "RELEASE_TAG=v2.0-$(date +\%Y\%m\%d\%H\%M)" >> $GITHUB_ENV

      - name: "🚀 Publish to GitHub Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "AeroHyper 2.0 (Android 15) - Redmi 13C 5G / POCO M6 5G"
          body: |
            ## 🚀 AeroHyper 2.0 — Ultimate Rootless Custom ROM
            
            A clean, flagship-grade HyperOS 2.0 experience engineered natively for the **Redmi 13C 5G** and **POCO M6 5G** (air/atmos). Built for smooth visuals, high-frame-rate gaming, and zero bloatware.
            
            ### ✨ System & UI Enhancements
            *   **Real-Time Control Center Blur:** Native Gaussian blur forced via `air.xml` reconfiguration.
            *   **Advanced System Animations:** `is_low_end_device` constraints bypassed to unlock fluid transitions.
            *   **Zero Background Throttling:** Global removal of `ro.config.low_ram` properties.
            *   **Signature Bypass (Core Patch):** Multi-dex patched `services.jar` for unsigned application support.
            *   **Neutralized AVB 2.0:** Pre-patched VBMeta images with hash verification permanently disabled.
            
            ### 🎮 Gaming & Exclusive Perks
            *   **POCO F5 Spoofing:** System model spoofed to `marble` to unlock native **90 FPS in BGMI / PUBG Mobile**.
            *   **Camera Protection:** Proprietary MediaTek vendor trees remain fully intact.
            *   **Unlimited Google Photos:** Pixel 8 Pro sysconfig injected for original-quality cloud storage.
            
            ### ⚡ Integrated Custom Modules
            *   **HyperOS Launcher:** Flagship recents provider and fluidity patch.
            *   **HyperOS Security Center:** Unlocked performance and Game Turbo tiers.
            *   **HyperOS Theme Manager:** Unrestricted 3rd-party theme importing.
            *   **Advanced AOD:** Flagship lock screen clock styles unlocked.
            
            ### 🧹 Debloat Protocol
            *   Purged Xiaomi tracking (`MSA-Global`, `AnalyticsCore`, `MiBugReport`).
            *   Stripped third-party bloat (Facebook installers, factory test APKs).
            *   Precompiled ART bytecaches cleanly wiped to ensure zero boot errors.
            
            ### 📦 Installation Guide
            1. Extract the downloaded `AeroHyper_2.0_Air_Fastboot.zip` on your Windows or Linux PC.
            2. Reboot your device to Fastboot mode (Hold `Volume Down + Power`).
            3. Connect via USB and double-click `windows_fastboot_install.bat`.
            4. Wait for the terminal to print complete and let the phone boot up. 
            > ⚠️ **Note:** A clean flash wipes internal storage. Backup all data beforehand. Your engineering preloader is protected.
            
            ---
            *Maintained by the Open Source Android Modding Community.*
          files: AeroHyper_2.0_Air_Fastboot.zip
          draft: false
          prerelease: false
