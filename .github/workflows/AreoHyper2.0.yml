name: 🚀 Build HyperAreo 2.0 (A15 Flagship Hybrid - Final Master)

on:
  workflow_dispatch:

env:
  ROM_URL: "https://downloads.sourceforge.net/project/miui-greeshan-repack/HyperOS2/Redmi-13C-air/greeshan.by_Redmi13C_5G_air_OS2.0.208.0.VGQINXM_15.0_99c03.zip?ts=gAAAAABqsp7g8HzuyxkFSDd8ITBTILv-VOruIsjNIih90R24pdeBsZCwdbZOH-PkElN6POucSAmARbHfaiBK5dYJ6VDklHyHzw%3D%3D&use_mirror=twds"
  LAUNCHER_URL: "https://github.com/Mods-Center/HyperOS-Launcher/releases/download/V5/HyperOS_LauncherV5%40kashis_cringey_stuffs.zip"
  SECURITY_URL: "https://github.com/Mods-Center/HyperOS-Security-Center/releases/download/V5/v5HyperOS_SecurityCenter%40kashis_cringey_stuffs.zip"
  AOD_URL: "https://github.com/Mods-Center/HyperOS-AOD/releases/download/V2/HyperOS_AOD_V2%40kashis_cringey_stuffs.zip"
  THEME_URL: "https://github.com/Mods-Center/HyperOS-Theme-Manager/releases/download/theme-manager-v4/HyperOS_ThemeManagerV4%40kashis_cringey_stuffs.zip"
  VAULT_URL: "https://github.com/Mods-Center/HyperOS-App-Vault/releases/download/V4/HyperOS_AppVaultV4%40kashis_cringey_stuffs.zip"
  DEVICE_SUPER_SIZE_BYTES: "7516192768"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_package:
    name: "Compile HyperAreo Hybrid (A15 Final Master)"
    runs-on: ubuntu-24.04
            
    steps:
      - name: "💾 Free Massive Disk Space"
        run: |
          echo "Purging build runner bloatware..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker system prune -a -f --volumes
          sudo apt-get clean
          df -h

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "🧹 Install Build Toolchain"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils brotli wget unzip jq python3 curl aapt aria2 liblz4-tool
          
          curl -sL --fail --show-error -o lpunpack https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpunpack || \
          curl -sL --fail --show-error -o lpunpack https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py
          
          curl -sL --fail --show-error -o lpmake https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpmake || \
          curl -sL --fail --show-error -o lpmake https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpmake
          
          chmod +x lpunpack lpmake
          sudo mv lpunpack lpmake /usr/local/bin/

          curl -sL --fail --show-error -o apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar
          sudo mv apktool.jar /usr/local/bin/

      - name: "📥 Download Greeshan Base via Aria2"
        run: |
          set -euo pipefail
          mkdir -p build_workspace/extracted build_workspace/tree
          cd build_workspace
          
          echo "Pulling Greeshan Repack (16 Threads)..."
          aria2c -x 16 -s 16 -k 1M --continue=true --auto-file-renaming=false -d . -o greeshan_rom.zip "$ROM_URL"
          unzip -q greeshan_rom.zip -d extracted/
          rm -f greeshan_rom.zip

      - name: "🧩 Dynamic Super Unpacker & Firmware Extraction"
        run: |
          set -euo pipefail
          cd build_workspace/extracted
          
          mkdir -p ../../package_root/firmware-update ../../package_root/bin/windows
          find . -maxdepth 2 -type f -name "*.img" ! -name "super.img" ! -name "greeshan.img" ! -name "cust.img" ! -name "userdata.img" -exec cp {} ../../package_root/firmware-update/ \;

          MASSIVE_IMG=$(find . -type f -name "*.img" -size +1500M | head -1 || true)
          if [ -n "$MASSIVE_IMG" ]; then
              echo "Unpacking massive super image: $MASSIVE_IMG"
              if file "$MASSIVE_IMG" | grep -qi "sparse"; then
                  simg2img "$MASSIVE_IMG" super_raw.img
              else
                  mv "$MASSIVE_IMG" super_raw.img
              fi
              lpunpack super_raw.img ./
              rm -f super_raw.img
          else
              echo "::error::Failed to locate raw or sparse super image."
              exit 1
          fi

          mkdir -p ../tree/system ../tree/system_ext ../tree/product ../tree/vendor ../tree/mi_ext /tmp/erofs_mnt
          for part in system system_ext product mi_ext vendor; do
              IMG=$(find . -iname "${part}_a.img" -o -iname "${part}.img" | head -1 || true)
              if [ -n "$IMG" ]; then
                  echo "Extracting $part via EROFS (Permissions Preserved)..."
                  sudo fsck.erofs --extract="../tree/$part" "$IMG" || \
                  (sudo mount -o loop "$IMG" /tmp/erofs_mnt && sudo rsync -aHAX /tmp/erofs_mnt/ "../tree/$part/" && sudo umount /tmp/erofs_mnt) || true
                  
                  if [ ! -d "../tree/$part" ] || [ -z "$(ls -A ../tree/$part 2>/dev/null)" ]; then
                      echo "::error::Critical failure extracting $part partition. Halting build to prevent brick."
                      exit 1
                  fi
              fi
          done

      - name: "📦 Fetch Kashi Mods Ecosystem"
        run: |
          set -euo pipefail
          mkdir -p mods mods_extracted
          wget -q -O mods/launcher.zip "$LAUNCHER_URL"
          wget -q -O mods/security.zip "$SECURITY_URL"
          wget -q -O mods/aod.zip "$AOD_URL"
          wget -q -O mods/theme.zip "$THEME_URL"
          wget -q -O mods/vault.zip "$VAULT_URL"

          for z in launcher security aod theme vault; do
            unzip -q "mods/$z.zip" -d "mods_extracted/$z"
          done

      - name: "🧹 Anti-OTA Debloat & Mod Injection"
        run: |
          set -euo pipefail
          cd build_workspace
          
          echo "Watermark: Project HyperAreo - Yash"
          echo "Obliterating all stock, regional, renamed, and OTA Updater packages..."
          
          for target in "Updater" "MiuiUpdater" "XiaomiUpdater" \
                        "MiuiHome" "PocoHome" "PocoLauncher" "MintLauncher" "Launcher3" "LauncherHyperOS2" \
                        "SecurityCenter" "SecurityCenterHyperOS2" "MIUISecurityCenter" "MIUISecurityCenterGlobal" \
                        "MIUIAod" "MIUIThemeManager" "MIUIThemeManagerGlobal" \
                        "AppVault" "PersonalAssistant" "MIUIPersonalAssistant" "MinusScreen"; do
            sudo find tree/ -type d -iname "$target" -exec rm -rf {} + 2>/dev/null || true
          done

          purge_art() {
            sudo find "$1" -type f \( -name "*.odex" -o -name "*.vdex" -o -name "*.art" -o -name "*.prof" -o -name "*.bprof" \) -delete 2>/dev/null || true
          }
          
          add_context() {
            local path=$1
            local ctx=$2
            if [ -f "$ctx" ]; then
              sudo sed -i -e '$a\' "$ctx" 
              sudo bash -c "echo '$path(/.*)? u:object_r:system_file:s0' >> $ctx"
            fi
          }
          
          fix_perms() {
            sudo find "$1" -type d -exec chmod 755 {} \;
            sudo find "$1" -type f -exec chmod 644 {} \;
            sudo chown -R root:root "$1"
          }

          PROD_CTX=$(sudo find tree/product -name "product_file_contexts" 2>/dev/null | head -1 || echo "")

          if [ -f "../mods_extracted/launcher/files/MiuiHome.apk" ]; then
            sudo mkdir -p tree/product/priv-app/MiuiHome
            sudo cp ../mods_extracted/launcher/files/MiuiHome.apk tree/product/priv-app/MiuiHome/MiuiHome.apk
            fix_perms "tree/product/priv-app/MiuiHome"
            purge_art "tree/product/priv-app/MiuiHome"
            [ -n "$PROD_CTX" ] && add_context "/product/priv-app/MiuiHome" "$PROD_CTX"
          fi

          if [ -f "../mods_extracted/security/files/SecurityCenter.apk" ]; then
            sudo mkdir -p tree/product/priv-app/MIUISecurityCenterGlobal
            sudo cp ../mods_extracted/security/files/SecurityCenter.apk tree/product/priv-app/MIUISecurityCenterGlobal/MIUISecurityCenterGlobal.apk
            fix_perms "tree/product/priv-app/MIUISecurityCenterGlobal"
            purge_art "tree/product/priv-app/MIUISecurityCenterGlobal"
            [ -n "$PROD_CTX" ] && add_context "/product/priv-app/MIUISecurityCenterGlobal" "$PROD_CTX"
          fi

          if [ -f "../mods_extracted/aod/files/MIUIAod.apk" ]; then
            sudo mkdir -p tree/product/priv-app/MIUIAod
            sudo cp ../mods_extracted/aod/files/MIUIAod.apk tree/product/priv-app/MIUIAod/MIUIAod.apk
            fix_perms "tree/product/priv-app/MIUIAod"
            purge_art "tree/product/priv-app/MIUIAod"
            [ -n "$PROD_CTX" ] && add_context "/product/priv-app/MIUIAod" "$PROD_CTX"
          fi

          if [ -f "../mods_extracted/theme/files/MIUIThemeManager.apk" ]; then
            sudo mkdir -p tree/product/app/MIUIThemeManagerGlobal/lib/arm64
            sudo cp ../mods_extracted/theme/files/MIUIThemeManager.apk tree/product/app/MIUIThemeManagerGlobal/MIUIThemeManagerGlobal.apk
            shopt -s nullglob
            for so in ../mods_extracted/theme/files/lib/arm64/*.so; do
              sudo cp "$so" tree/product/app/MIUIThemeManagerGlobal/lib/arm64/
            done
            shopt -u nullglob
            fix_perms "tree/product/app/MIUIThemeManagerGlobal"
            purge_art "tree/product/app/MIUIThemeManagerGlobal"
            [ -n "$PROD_CTX" ] && add_context "/product/app/MIUIThemeManagerGlobal" "$PROD_CTX"
          fi

          if [ -f "../mods_extracted/vault/files/AppVault.apk" ]; then
            sudo mkdir -p tree/product/app/AppVault
            sudo cp ../mods_extracted/vault/files/AppVault.apk tree/product/app/AppVault/AppVault.apk
            fix_perms "tree/product/app/AppVault"
            purge_art "tree/product/app/AppVault"
            [ -n "$PROD_CTX" ] && add_context "/product/app/AppVault" "$PROD_CTX"
          fi

      - name: "🔧 Global Priv-App Bypass & HyperAreo Rebranding"
        run: |
          set -euo pipefail
          cd build_workspace
          
          sudo find tree -name "build.prop" -type f 2>/dev/null | while read -r prop; do
            sudo bash -c "echo '' >> $prop"
            
            # --- Text Rebranding to HyperAreo 2.0 ---
            sudo sed -i 's/^ro.build.display.id=.*/ro.build.display.id=HyperAreo 2.0/' "$prop"
            sudo sed -i 's/^ro.build.version.incremental=.*/ro.build.version.incremental=HyperAreo-FinalMaster/' "$prop"
            sudo sed -i 's/^ro.product.mod_device=.*/ro.product.mod_device=HyperAreo_air/' "$prop"
            sudo sed -i 's/^ro.miui.ui.version.name=.*/ro.miui.ui.version.name=HyperAreo/' "$prop"
            
            # --- Priv-App Whitelist Bypass ---
            if sudo grep -q "^ro.control_privapp_permissions=" "$prop"; then
              sudo sed -i 's/^ro.control_privapp_permissions=.*/ro.control_privapp_permissions=log/' "$prop"
            else
              sudo bash -c "echo 'ro.control_privapp_permissions=log' >> $prop"
            fi
            
            # --- Low RAM & Background Blur Overrides ---
            sudo sed -i '/^ro.config.low_ram=/d' "$prop"
            sudo bash -c "echo 'ro.config.low_ram=false' >> $prop"
            
            sudo sed -i '/^ro.surface_flinger.supports_background_blur=/d' "$prop"
            sudo bash -c "echo 'ro.surface_flinger.supports_background_blur=1' >> $prop"
            
            sudo sed -i '/^persist.sys.background_blur_/d' "$prop"
            sudo bash -c "echo 'persist.sys.background_blur_supported=true' >> $prop"
            sudo bash -c "echo 'persist.sys.background_blur_status_default=true' >> $prop"
          done

      - name: "🔓 Precision Core Signature Patch (A15 Safe-Mode)"
        run: |
          set -euo pipefail
          cd build_workspace
          
          echo "Purging precompiled ART binaries for framework..."
          sudo find tree/system -type f \( -name "services.odex" -o -name "services.vdex" -o -name "services.art" -o -name "services.jar.prof" \) -delete 2>/dev/null || true

          SERVICES_PATH=$(sudo find tree/system -name "services.jar" 2>/dev/null | head -1 || true)
          if [ -z "$SERVICES_PATH" ]; then
            echo "::error::services.jar not found! Cannot apply core signature bypass."
            exit 1
          fi

          cp "$SERVICES_PATH" ./services_temp.jar
          sudo chown $USER:$USER ./services_temp.jar
          java -Xmx4G -jar /usr/local/bin/apktool.jar d -r -q ./services_temp.jar -o jar_workspace

          python3 - << 'EOF'
          import os

          TARGET_METHODS = ["compareSignatures", "checkSignatures", "matchSignatures", "checkUidSignatures"]
          patched_methods = 0

          for root, dirs, files in os.walk("jar_workspace"):
              if "com/android/server/pm" not in root.replace("\\", "/"): continue
              for fname in files:
                  if not fname.endswith(".smali"): continue
                  path = os.path.join(root, fname)
                  with open(path, "r", encoding="utf-8") as f: lines = f.readlines()

                  out_lines = []
                  in_target = False
                  changed = False

                  for line in lines:
                      if line.startswith(".method"):
                          for method in TARGET_METHODS:
                              if f" {method}(" in line:
                                  if " abstract " in line or " native " in line:
                                      print(f"Safely bypassing abstract/native declaration: {method} in {fname}")
                                      break
                                      
                                  in_target = True
                                  ret_type = line.strip()[-1]
                                  out_lines.append(line)
                                  val = "0x1" if ret_type == "Z" else "0x0"
                                  out_lines.append(f"    .locals 1\n    const/4 v0, {val}\n    return v0\n")
                                  changed = True
                                  patched_methods += 1
                                  print(f"Patched {method} in {fname}")
                                  break
                          if not in_target:
                              out_lines.append(line)
                      elif in_target:
                          if line.startswith(".end method"):
                              out_lines.append(line)
                              in_target = False
                      else:
                          out_lines.append(line)

                  if changed:
                      with open(path, "w", encoding="utf-8") as f: f.writelines(out_lines)

          if patched_methods == 0:
              print("Warning: Target signature comparison methods not found.")
          else:
              print(f"Total Type-Safe signature checks patched: {patched_methods}")
          EOF

          java -Xmx4G -jar /usr/local/bin/apktool.jar b -r -q jar_workspace -c -o ./services_patched.jar
          sudo cp ./services_patched.jar "$SERVICES_PATH"
          sudo chmod 644 "$SERVICES_PATH"
          sudo chown root:root "$SERVICES_PATH"
          rm -rf jar_workspace services_temp.jar services_patched.jar

      - name: "✨ Flagship XML Injections"
        run: |
          set -euo pipefail
          cd build_workspace
          
          sudo python3 - << 'EOF'
          import os, glob, re
          xml_files = glob.glob("tree/**/air*.xml", recursive=True) + glob.glob("tree/**/miui_features*.xml", recursive=True)
          
          flags_to_inject = {
              "support_window_blur": "true",
              "support_new_control_center": "true",
              "support_aod": "true",
              "is_screenshot_frame_supported": "true",
              "support_sound_assist": "true",
              "support_app_hiding": "true",
              "is_support_partial_screenshot": "true",
              "support_local_ocr": "true",
              "gallery_support_analytic_face_and_scene": "true",
              "support_wild_boost": "true",
              "support_displayfeature_gamemode": "true",
              "is_support_video_tool_box": "true",
              "is_support_split_screen": "true",
              "support_freeform_window": "true",
              "is_support_multi_window": "true",
              "support_multiple_freeform": "true"
          }
          
          for xml_path in xml_files:
              with open(xml_path, "r", encoding="utf-8") as f: content = f.read()
              for flag in flags_to_inject:
                  content = re.sub(rf'<bool name="{flag}">.*?</bool>', '', content)
                  content = re.sub(rf'<bool name="{flag}"\s*/>', '', content)
              
              injection = "\n" + "".join([f'    <bool name="{k}">{v}</bool>\n' for k,v in flags_to_inject.items()])
              
              if "</features>" in content:
                  content = content.replace("</features>", injection + "</features>")
              elif "</MIUI_Features>" in content:
                  content = content.replace("</MIUI_Features>", injection + "</MIUI_Features>")
              elif "<features/>" in content:
                  content = content.replace("<features/>", "<features>" + injection + "</features>")
              elif "<MIUI_Features/>" in content:
                  content = content.replace("<MIUI_Features/>", "<MIUI_Features>" + injection + "</MIUI_Features>")
                  
              content = os.linesep.join([s for s in content.splitlines() if s.strip()])
              with open(xml_path, "w", encoding="utf-8") as f: f.write(content)
          EOF

          PIXEL_XML="tree/product/etc/sysconfig/pixel_unlimited.xml"
          sudo mkdir -p tree/product/etc/sysconfig
          sudo bash -c "cat > $PIXEL_XML" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_PRELOAD" />
              <feature name="com.google.android.apps.photos.PIXEL_2021_MIDYEAR_STORAGE" />
              <feature name="com.google.android.feature.PIXEL_2021_MIDYEAR_EXPERIENCE" />
          </config>
          EOF
          sudo chmod 644 "$PIXEL_XML"
          sudo chown root:root "$PIXEL_XML"

      - name: "💾 Compile EROFS (A15 System-As-Root & VAB Aligned)"
        run: |
          set -euo pipefail
          cd build_workspace
          mkdir -p output

          SYS_CTX=$(sudo find tree/system -name "plat_file_contexts" 2>/dev/null | head -1 || echo "")
          PROD_CTX=$(sudo find tree/product -name "product_file_contexts" 2>/dev/null | head -1 || echo "")
          EXT_CTX=$(sudo find tree/system_ext -name "system_ext_file_contexts" 2>/dev/null | head -1 || echo "")
          MI_EXT_CTX=$(sudo find tree/mi_ext -name "mi_ext_file_contexts" 2>/dev/null | head -1 || echo "")
          VENDOR_CTX=$(sudo find tree/vendor -name "vendor_file_contexts" 2>/dev/null | head -1 || echo "")

          [ -n "$SYS_CTX" ] && sudo mkfs.erofs -x1 -zlz4hc,9 --mount-point=/system --file-contexts="$SYS_CTX" output/system.img tree/system
          [ -n "$PROD_CTX" ] && sudo mkfs.erofs -x1 -zlz4hc,9 --mount-point=/product --file-contexts="$PROD_CTX" output/product.img tree/product
          [ -n "$EXT_CTX" ] && sudo mkfs.erofs -x1 -zlz4hc,9 --mount-point=/system_ext --file-contexts="$EXT_CTX" output/system_ext.img tree/system_ext
          [ -n "$MI_EXT_CTX" ] && sudo mkfs.erofs -x1 -zlz4hc,9 --mount-point=/mi_ext --file-contexts="$MI_EXT_CTX" output/mi_ext.img tree/mi_ext
          [ -n "$VENDOR_CTX" ] && sudo mkfs.erofs -x1 -zlz4hc,9 --mount-point=/vendor --file-contexts="$VENDOR_CTX" output/vendor.img tree/vendor

          sudo rm -rf tree/
          sudo chown -R $USER:$USER output/

          sudo python3 - << EOF
          import os, subprocess, sys

          super_size = int("${DEVICE_SUPER_SIZE_BYTES}")
          group_name = "main_a"
          partitions = ["system_a", "system_ext_a", "product_a", "vendor_a", "odm_a", "mi_ext_a", "system_dlkm_a", "vendor_dlkm_a", "odm_dlkm_a"]
          
          lpmake_cmd = ["lpmake", "--metadata-size", "65536", "--super-name", "super", "--metadata-slots", "2", "--virtual-ab", "--device", f"super:{super_size}"]

          total_size = 0
          for p_name in partitions:
              base_name = p_name.replace("_a", "")
              if os.path.exists(f"output/{base_name}.img"): src_img = f"output/{base_name}.img"
              elif os.path.exists(f"extracted/{p_name}.img"): src_img = f"extracted/{p_name}.img"
              elif os.path.exists(f"extracted/{base_name}.img"): src_img = f"extracted/{base_name}.img"
              else: src_img = None

              if src_img:
                  size = os.path.getsize(src_img)
                  remainder = size % 4096
                  if remainder != 0: size = size + (4096 - remainder)
                  total_size += size
                  lpmake_cmd.extend(["--partition", f"{p_name}:readonly:{size}:{group_name}", "--image", f"{p_name}={src_img}"])

          # Hardened Group Size Clamp: Protects lpmake against overflowing the super partition. 15MB Overhead allowance.
          group_size = total_size + 104857600
          max_group_size = super_size - 15728640
          
          if group_size > max_group_size: 
              group_size = max_group_size

          if total_size > max_group_size:
              print(f"Error: Total partition size ({total_size}) exceeds maximum physical capacity allowed for group ({max_group_size}). Debloat more apps!")
              sys.exit(1)

          lpmake_cmd.extend(["--group", f"{group_name}:{group_size}"])
          lpmake_cmd.extend(["--sparse", "--output", "../package_root/firmware-update/super.img"])
          print(f"Executing: {' '.join(lpmake_cmd)}")
          subprocess.run(lpmake_cmd, check=True)
          EOF

      - name: "📜 Generate Safe Dual-Slot Flash Script (Stock OEM Logic)"
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/platform-tools-latest-windows.zip -O pt_win.zip
          unzip -q pt_win.zip
          cp platform-tools/fastboot.exe package_root/bin/windows/
          cp platform-tools/AdbWinApi.dll package_root/bin/windows/
          cp platform-tools/AdbWinUsbApi.dll package_root/bin/windows/
          rm -rf platform-tools pt_win.zip

          cat << 'EOF' > package_root/windows_clean_install.bat
          @echo off
          cd /d "%~dp0"
          set "fastboot=bin\windows\fastboot.exe"
          echo Waiting for device in Fastboot mode...
          "%fastboot%" getvar product >nul 2>nul

          echo Forcing active slot to A...
          "%fastboot%" set_active a

          echo ========================================================
          echo Flashing Base Firmware Core
          echo (Skipping Preloader for MTK SLA Safety)
          echo ========================================================
          EOF

          for img in package_root/firmware-update/*.img; do
            [ -e "$img" ] || continue
            part=$(basename "$img" .img)
            
            # Skip super, userdata, and preloader completely
            if [[ "$part" == "super" || "$part" == "userdata" || "$part" == "preloader"* ]]; then
                continue
            fi
            
            echo "if not exist \"firmware-update\\$part.img\" goto skip_$part" >> package_root/windows_clean_install.bat
            
            # CRITICAL PARTITIONS -> FLASH TO BOTH SLOTS
            if [[ "$part" == "boot" || "$part" == "dtbo" || "$part" == "vendor_boot" || "$part" == vbmeta* || "$part" == "lk" || "$part" == "tee" || "$part" == "scp" || "$part" == "sspm" || "$part" == "md1img" || "$part" == "spmfw" || "$part" == "gz" || "$part" == "pi_img" || "$part" == "dpm" || "$part" == "mcupm" ]]; then
                echo "echo Flashing CRITICAL: $part to BOTH slots..." >> package_root/windows_clean_install.bat
                
                # Apply AVB disable flags only to vbmeta partitions
                if [[ "$part" == vbmeta* ]]; then
                    echo "\"%fastboot%\" --disable-verity --disable-verification flash ${part}_a \"firmware-update\\$part.img\" || \"%fastboot%\" --disable-verity --disable-verification flash ${part} \"firmware-update\\$part.img\"" >> package_root/windows_clean_install.bat
                    echo "\"%fastboot%\" --disable-verity --disable-verification flash ${part}_b \"firmware-update\\$part.img\" >nul 2>&1" >> package_root/windows_clean_install.bat
                else
                    echo "\"%fastboot%\" flash ${part}_a \"firmware-update\\$part.img\" || \"%fastboot%\" flash ${part} \"firmware-update\\$part.img\"" >> package_root/windows_clean_install.bat
                    echo "\"%fastboot%\" flash ${part}_b \"firmware-update\\$part.img\" >nul 2>&1" >> package_root/windows_clean_install.bat
                fi
            
            # NON-CRITICAL PARTITIONS -> FLASH TO SLOT A ONLY
            else
                echo "echo Flashing $part to Slot A..." >> package_root/windows_clean_install.bat
                echo "\"%fastboot%\" flash ${part}_a \"firmware-update\\$part.img\" || \"%fastboot%\" flash ${part} \"firmware-update\\$part.img\"" >> package_root/windows_clean_install.bat
            fi
            
            echo ":skip_$part" >> package_root/windows_clean_install.bat
            echo "" >> package_root/windows_clean_install.bat
          done

          # Add FastbootD, Super, Wipe, and Final Slot Lock
          cat << 'EOF' >> package_root/windows_clean_install.bat
          echo ========================================================
          echo Rebooting to FastbootD (Critical for MTK Super Partition)
          echo ========================================================
          "%fastboot%" reboot fastboot
          ping 127.0.0.1 -n 5 > nul

          echo Flashing Super Partition (This will take a few minutes)...
          "%fastboot%" flash super "firmware-update\super.img"

          echo Performing Factory Wipe (F2FS Safe)...
          "%fastboot%" erase userdata
          "%fastboot%" erase metadata

          echo ========================================================
          echo Locking Active Slot to A before Reboot
          echo ========================================================
          "%fastboot%" set_active a

          echo Rebooting to HyperAreo 2.0 Final Master Edition!
          "%fastboot%" reboot
          pause
          EOF

      - name: "📦 Compress Distribution ZIP"
        run: |
          cd package_root
          # Standard ZIP compression
          zip -r -9 ../HyperAreo_2.0_Greeshan_Hybrid_Fastboot.zip ./*

      - name: "💾 Upload to GitHub Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: HyperAreo_2.0_Greeshan_Hybrid_Fastboot
          path: HyperAreo_2.0_Greeshan_Hybrid_Fastboot.zip
          compression-level: 0 # File is already zipped

      - name: "☁️ Upload to GoFile (With Diagnostic Logging)"
        id: upload
        continue-on-error: true
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name' || echo "")
          if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
            echo "Attempting to upload to GoFile server: $SERVER..."
            
            UPLOAD_RESPONSE=$(curl -s -F file=@HyperAreo_2.0_Greeshan_Hybrid_Fastboot.zip https://${SERVER}.gofile.io/contents/uploadfile)
            
            echo "--- RAW GOFILE API RESPONSE ---"
            echo "$UPLOAD_RESPONSE"
            echo "-------------------------------"
            
            GOFILE_LINK=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.downloadPage' || echo "")
            
            if [ -n "$GOFILE_LINK" ] && [ "$GOFILE_LINK" != "null" ]; then
              echo "✅ Success! Download Link: $GOFILE_LINK"
            else
              echo "❌ GoFile upload completed, but the API did not return a valid download link."
            fi
          else
            echo "❌ Failed to contact GoFile API."
          fi
