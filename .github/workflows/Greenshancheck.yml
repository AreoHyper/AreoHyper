name: 🔍 Full Audit (Includes Dynamic Launcher Hunt)

on:
  workflow_dispatch:

env:
  ROM_URL: "https://downloads.sourceforge.net/project/miui-greeshan-repack/HyperOS2/Redmi-13C-air/greeshan.by_Redmi13C_5G_air_OS2.0.208.0.VGQINXM_15.0_99c03.zip?ts=gAAAAABqsp7g8HzuyxkFSDd8ITBTILv-VOruIsjNIih90R24pdeBsZCwdbZOH-PkElN6POucSAmARbHfaiBK5dYJ6VDklHyHzw%3D%3D&use_mirror=twds"

jobs:
  audit_repack:
    name: "Deep Audit: Greeshan Repack"
    runs-on: ubuntu-24.04

    steps:
      - name: "💾 Maximize Build Disk Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "🧹 Install Audit Toolchain (Added AAPT)"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils brotli wget unzip jq python3 curl aapt
          
          echo "Downloading lpunpack..."
          if ! curl -sL --fail --show-error -o lpunpack https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpunpack; then
            curl -sL --fail --show-error -o lpunpack https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py
          fi
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

          echo "Downloading Apktool..."
          curl -sL --fail --show-error -o apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar
          sudo mv apktool.jar /usr/local/bin/

          echo "Downloading payload-dumper-go..."
          curl -sL -o payload.tar.gz https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xzf payload.tar.gz payload-dumper-go
          sudo mv payload-dumper-go /usr/local/bin/
          rm -f payload.tar.gz
          
          mkdir -p audit_workspace/extracted audit_workspace/tree/system audit_workspace/tree/product audit_workspace/tree/system_ext audit_workspace/tree/vendor audit_workspace/tree/mi_ext

      - name: "📥 Download & Extract Greeshan Repack"
        run: |
          set -euo pipefail
          cd audit_workspace
          
          echo "Downloading Greeshan Repack..."
          curl -L --fail --retry 3 -o greeshan_rom.zip "$ROM_URL"
          
          echo "Unzipping archive..."
          unzip -q greeshan_rom.zip -d extracted/
          rm -f greeshan_rom.zip

      - name: "🧩 Dynamic Super Hunter"
        run: |
          set -euo pipefail
          cd audit_workspace/extracted
          
          PAYLOAD_BIN=$(find . -name "payload.bin" | head -1 || true)
          if [ -n "$PAYLOAD_BIN" ]; then
              echo "Found payload.bin! Ripping images..."
              payload-dumper-go -c 4 -o ./ "$PAYLOAD_BIN"
          fi

          MASSIVE_IMG=$(find . -type f -name "*.img" -size +1500M | head -1 || true)
          
          if [ -n "$MASSIVE_IMG" ]; then
              echo "Found massive image: $MASSIVE_IMG! Unpacking..."
              if file "$MASSIVE_IMG" | grep -qi "sparse"; then
                  simg2img "$MASSIVE_IMG" super_raw.img
              else
                  mv "$MASSIVE_IMG" super_raw.img
              fi
              lpunpack super_raw.img ./
              rm -f super_raw.img
          else
              echo "No massive single image found. Checking for chunked sparse files..."
              CHUNK_BASE=$(find . -name "*.img.0" | head -1 || true)
              if [ -n "$CHUNK_BASE" ]; then
                  BASE_NAME="${CHUNK_BASE%.0}"
                  echo "Found chunked files for $BASE_NAME. Merging..."
                  simg2img ${BASE_NAME}.* super_raw.img
                  lpunpack super_raw.img ./
                  rm -f super_raw.img
              fi
          fi

          for part in system product system_ext vendor mi_ext; do
              if [ -f "images/$part.new.dat.br" ]; then
                  echo "Found compressed $part. Decompressing..."
                  brotli -d "images/$part.new.dat.br" -o "$part.new.dat"
                  curl -sL --fail --show-error -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
                  python3 sdat2img.py "images/$part.transfer.list" "$part.new.dat" "$part.img"
                  rm -f "$part.new.dat" "images/$part.transfer.list" "images/$part.new.dat.br"
              fi
          done

      - name: "📂 Mount & Extract Partitions"
        run: |
          set -euo pipefail
          mkdir -p /tmp/erofs_mnt
          cd audit_workspace/extracted
          
          for part in system product system_ext vendor mi_ext; do
              IMG=$(find . -iname "${part}_a.img" -o -iname "${part}.img" | head -1 || true)
              if [ -n "$IMG" ]; then
                  echo "Mounting $IMG to audit folder..."
                  sudo mount -t erofs -o loop "$IMG" /tmp/erofs_mnt || sudo mount -t ext4 -o loop "$IMG" /tmp/erofs_mnt || echo "Warning: Failed to mount $IMG"
                  
                  if mountpoint -q /tmp/erofs_mnt; then
                      sudo rsync -a /tmp/erofs_mnt/ "../tree/$part/"
                      sudo umount /tmp/erofs_mnt
                  fi
              fi
          done

      - name: "🔎 Dynamic Launcher Hunt (Finds any renamed Launcher)"
        run: |
          set -euo pipefail
          cd audit_workspace
          
          # Project AeroHyper - Watermark: Yash
          
          # Forcefully grant Read & Execute permissions to the runner so it can scan system folders
          sudo chmod -R +rX tree/
          
          REPORT="## 🔎 Dynamic Launcher Hunt\n"
          REPORT+="Scanned all APKs for \`android.intent.category.HOME\`:\n\n"
          
          echo "Scanning all APKs for Home category..."
          
          # Added a failsafe (|| true) to prevent pipefail crashes if a broken symlink is found
          FOUND_LAUNCHERS=$(find tree -type f -name "*.apk" 2>/dev/null | while read -r apk; do
            if aapt dump xmltree "$apk" AndroidManifest.xml 2>/dev/null | grep -q "android.intent.category.HOME"; then
                echo "- 🎯 **Found Launcher:** \`$apk\`"
            fi
          done || true)
          
          if [ -n "$FOUND_LAUNCHERS" ]; then
             REPORT+="$FOUND_LAUNCHERS\n\n"
          else
             REPORT+="- ⚠️ Could not find any APK with the HOME intent.\n\n"
          fi
          
          echo -e "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: "🕵️‍♂️ Execute Deep Audit"
        id: audit
        run: |
          set -euo pipefail
          cd audit_workspace


      - name: "🔎 100% Confirmation Hunt (AOD & App Vault)"
        run: |
          set -euo pipefail
          cd audit_workspace
          
          # Forcefully grant Read & Execute permissions
          sudo chmod -R +rX tree/
          
          REPORT="## 🔎 100% Confirmation: AOD & App Vault\n"
          echo "Scanning all APKs for AOD and App Vault package names..."
          
          # Reads the true package name embedded inside the compiled APKs
          FOUND_APPS=$(find tree -type f -name "*.apk" 2>/dev/null | while read -r apk; do
            PKG=$(aapt dump badging "$apk" 2>/dev/null | grep "package: name=" | awk -F"'" '{print $2}')
            
            if [[ "$PKG" == "com.miui.aod" ]]; then
                echo "- 🎯 **Found AOD:** \`$apk\`"
            elif [[ "$PKG" == "com.miui.personalassistant" || "$PKG" == "com.mi.android.globallauncher" \vert{}\vert{} "$PKG" == "com.miui.appvault" ]]; then
                echo "- 🎯 **Found App Vault / Minus Screen:** \`$apk\` (Package: $PKG)"
            fi
          done || true)
          
          if [ -n "$FOUND_APPS" ]; then
             REPORT+="$FOUND_APPS\n\n"
          else
             REPORT+="- 👻 **100% Confirmed:** Neither AOD nor App Vault exist anywhere in this ROM. The coast is completely clear.\n\n"
          fi
          
          echo -e "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          
          REPORT="## 🕵️‍♂️ Greeshan Repack Deep Audit Report\n\n"
          
          if [ ! -d "tree/system" ]; then
              REPORT+="### ❌ CRITICAL ERROR\n"
              REPORT+="The \`system\` partition could not be extracted.\n\n"
              echo -e "$REPORT" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          REPORT+="### 1. Core Signature Patch (services.jar)\n"
          SERVICES_JAR=$(find tree/system -name "services.jar" 2>/dev/null | head -1 || true)
          if [ -n "$SERVICES_JAR" ]; then
              java -jar /usr/local/bin/apktool.jar d -r -q "$SERVICES_JAR" -o services_smali
              
              MATCHES=$(python3 -c '
          import os
          targets = ["compareSignatures", "checkSignatures", "matchSignatures"]
          found = False
          for root, _, files in os.walk("services_smali"):
              for f in files:
                  if not f.endswith(".smali"): continue
                  with open(os.path.join(root, f), "r", errors="ignore") as smali:
                      content = smali.read()
                      for t in targets:
                          if f" {t}(" in content:
                              print(f"- **{t}** found in `{f}`")
                              found = True
          if not found: print("- No signature methods found.")
              ')
              REPORT+="$MATCHES\n\n"
              
              if grep -rq "const/4 v0, 0x0" services_smali/smali/com/android/server/pm/ 2>/dev/null; then
                  REPORT+="- ✅ **Status:** Core Patch is ACTIVE.\n\n"
              else
                  REPORT+="- ⚠️ **Status:** Looks UNPATCHED (Original bytecode detected). Needs manual patching for Kashi mods.\n\n"
              fi
          else
              REPORT+="- ❌ \`services.jar\` not found in the extracted tree.\n\n"
          fi

          REPORT+="### 2. Device Features (\`air.xml\` / \`miui_features.xml\`)\n"
          XML_FILES=$(find tree -name "*air*.xml" -o -name "*miui_features*.xml" 2>/dev/null || true)
          if [ -n "$XML_FILES" ]; then
              for xml in $XML_FILES; do
                  REPORT+="**File:** \`$xml\`\n"
                  for flag in support_window_blur enable_miui_lite is_hongmi support_new_control_center support_app_hiding; do
                      VAL=$(grep -oP "(?<=<bool name=\"$flag\">)[^<]+" "$xml" || echo "NOT FOUND")
                      REPORT+="- \`$flag\`: **$VAL**\n"
                  done
                  REPORT+="\n"
              done
          else
              REPORT+="- ❌ No device feature XMLs found.\n\n"
          fi

          REPORT+="### 3. Build Properties (Blur & Priv-App)\n"
          BLUR_PROP=$(grep -h "surface_flinger.supports_background_blur" $(find tree -name "build.prop" 2>/dev/null) 2>/dev/null || echo "NOT FOUND")
          LITE_PROP=$(grep -h "ro.miui.ui.version.lite" $(find tree -name "build.prop" 2>/dev/null) 2>/dev/null || echo "NOT FOUND")
          PRIV_PROP=$(grep -h "ro.control_privapp_permissions" $(find tree -name "build.prop" 2>/dev/null) 2>/dev/null || echo "NOT FOUND")
          BRAND_PROP=$(grep -h "^ro.product.brand=" $(find tree/system -name "build.prop" 2>/dev/null | head -1) 2>/dev/null || echo "NOT FOUND")
          
          REPORT+="- \`ro.surface_flinger.supports_background_blur\`: **$BLUR_PROP**\n"
          REPORT+="- \`ro.miui.ui.version.lite\`: **$LITE_PROP**\n"
          REPORT+="- \`ro.control_privapp_permissions\`: **$PRIV_PROP**\n"
          REPORT+="- \`ro.product.brand\` (System): **$BRAND_PROP**\n\n"

          echo -e "$REPORT" >> "$GITHUB_STEP_SUMMARY"
