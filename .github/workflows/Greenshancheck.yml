name: 🔍 Audit Greeshan Repack Base Features

on:
  workflow_dispatch:

env:
  ROM_URL: "https://downloads.sourceforge.net/project/miui-greeshan-repack/HyperOS2/Redmi-13C-air/greeshan.by_Redmi13C_5G_air_OS2.0.208.0.VGQINXM_15.0_99c03.zip?ts=gAAAAABqsp7g8HzuyxkFSDd8ITBTILv-VOruIsjNIih90R24pdeBsZCwdbZOH-PkElN6POucSAmARbHfaiBK5dYJ6VDklHyHzw%3D%3D&use_mirror=twds"

jobs:
  audit_repack:
    name: "Deep Audit: Greeshan Repack"
    runs-on: ubuntu-24.04

    steps:
      - name: "💾 Maximize Build Disk Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: "🧹 Install Audit Toolchain"
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils brotli wget unzip jq python3 curl default-jdk
          
          # Install lpunpack for dynamic partitions
          wget -q -O lpunpack https://github.com/unix3m/lpunpack_and_lpmake/raw/master/bin/lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

          # Install Apktool for services.jar decompilation
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          sudo mv apktool.jar /usr/local/bin/

      - name: "📥 Download & Extract Greeshan Repack"
        run: |
          set -euo pipefail
          mkdir -p audit_workspace/extracted audit_workspace/tree
          
          echo "Downloading Greeshan Repack..."
          curl -L --fail --retry 3 -o greeshan_rom.zip "$ROM_URL"
          
          echo "Verifying downloaded archive..."
          file greeshan_rom.zip | grep -qi "Zip archive" || { echo "::error::SourceForge mirror returned an invalid file/HTML page."; exit 1; }
          
          echo "Unzipping archive..."
          unzip -q greeshan_rom.zip -d audit_workspace/extracted/
          rm -f greeshan_rom.zip

      - name: "🧩 Unpack Firmware Images"
        run: |
          set -euo pipefail
          cd audit_workspace/extracted
          
          # Scenario A: Fastboot ROM with super.img
          SUPER_IMG=$(find . -name "super.img" | head -1)
          if [ -n "$SUPER_IMG" ]; then
              echo "Found super.img. Unpacking..."
              if file "$SUPER_IMG" | grep -qi "sparse"; then
                  simg2img "$SUPER_IMG" super_raw.img
              else
                  mv "$SUPER_IMG" super_raw.img
              fi
              lpunpack super_raw.img ./
              rm -f super_raw.img
          fi

          # Scenario B: Recovery ROM with .dat.br files
          for part in system product system_ext vendor mi_ext; do
              if [ -f "$part.new.dat.br" ]; then
                  echo "Found brotli compressed $part. Decompressing..."
                  brotli -d "$part.new.dat.br" -o "$part.new.dat"
                  
                  wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
                  python3 sdat2img.py "$part.transfer.list" "$part.new.dat" "$part.img"
                  rm -f "$part.new.dat" "$part.transfer.list" "$part.new.dat.br"
              fi
          done

      - name: "📂 Mount & Extract Partitions"
        run: |
          set -euo pipefail
          mkdir -p /tmp/erofs_mnt
          cd audit_workspace/extracted
          
          for part in system product system_ext vendor mi_ext; do
              IMG=$(find . -iname "${part}_a.img" -o -iname "${part}.img" | head -1)
              if [ -n "$IMG" ]; then
                  echo "Mounting $part..."
                  mkdir -p "../tree/$part"
                  sudo mount -t erofs -o loop "$IMG" /tmp/erofs_mnt \vert{}\vert{} sudo mount -t ext4 -o loop "$IMG" /tmp/erofs_mnt
                  sudo rsync -a /tmp/erofs_mnt/ "../tree/$part/"
                  sudo umount /tmp/erofs_mnt
              fi
          done

      - name: "🕵️‍♂️ Execute Deep Audit"
        id: audit
        run: |
          set -euo pipefail
          cd audit_workspace
          
          REPORT="## 🕵️‍♂️ Greeshan Repack Audit Report\n\n"
          
          # 1. CORE PATCH AUDIT
          REPORT+="### 1. Core Signature Patch (services.jar)\n"
          SERVICES_JAR=$(find tree/system -name "services.jar" | head -1)
          if [ -n "$SERVICES_JAR" ]; then
              java -jar /usr/local/bin/apktool.jar d -r -q "$SERVICES_JAR" -o services_smali
              
              MATCHES=$(python3 -c '
          import os
          targets = ["compareSignatures", "checkSignatures", "matchSignatures"]
          found = False
          for root, _, files in os.walk("services_smali"):
              for f in files:
                  if not f.endswith(".smali"): continue
                  with open(os.path.join(root, f), "r", errors="ignore") as smali:
                      content = smali.read()
                      for t in targets:
                          if f" {t}(" in content:
                              print(f"- **{t}** found in `{f}`")
                              found = True
          if not found: print("- No signature methods found.")
              ')
              REPORT+="$MATCHES\n\n"
              
              if grep -rq "const/4 v0, 0x0" services_smali/smali/com/android/server/pm/ 2>/dev/null; then
                  REPORT+="- ✅ **Status:** Core Patch is ACTIVE.\n\n"
              else
                  REPORT+="- ⚠️ **Status:** Looks UNPATCHED (Original bytecode detected). Needs manual patching for Kashi mods.\n\n"
              fi
          else
              REPORT+="- ❌ \`services.jar\` not found.\n\n"
          fi

          # 2. FLAGSHIP XML INJECTIONS
          REPORT+="### 2. Device Features (\`air.xml\` / \`miui_features.xml\`)\n"
          XML_FILES=$(find tree -name "*air*.xml" -o -name "*miui_features*.xml" 2>/dev/null)
          if [ -n "$XML_FILES" ]; then
              for xml in $XML_FILES; do
                  REPORT+="**File:** \`$xml\`\n"
                  for flag in support_window_blur enable_miui_lite is_hongmi support_new_control_center support_app_hiding; do
                      VAL=$(grep -oP "(?<=<bool name=\"$flag\">)[^<]+" "$xml" || echo "NOT FOUND")
                      REPORT+="- \`$flag\`: **$VAL**\n"
                  done
                  REPORT+="\n"
              done
          else
              REPORT+="- ❌ No device feature XMLs found.\n\n"
          fi

          # 3. BUILD.PROP PROPERTIES
          REPORT+="### 3. Build Properties (Blur & Priv-App)\n"
          BLUR_PROP=$(grep -h "surface_flinger.supports_background_blur" $(find tree -name "build.prop") 2>/dev/null || echo "NOT FOUND")
          LITE_PROP=$(grep -h "ro.miui.ui.version.lite" $(find tree -name "build.prop") 2>/dev/null || echo "NOT FOUND")
          PRIV_PROP=$(grep -h "ro.control_privapp_permissions" $(find tree -name "build.prop") 2>/dev/null || echo "NOT FOUND")
          BRAND_PROP=$(grep -h "^ro.product.brand=" $(find tree/system -name "build.prop" 2>/dev/null | head -1) || echo "NOT FOUND")
          
          REPORT+="- \`ro.surface_flinger.supports_background_blur\`: **$BLUR_PROP**\n"
          REPORT+="- \`ro.miui.ui.version.lite\`: **$LITE_PROP**\n"
          REPORT+="- \`ro.control_privapp_permissions\`: **$PRIV_PROP**\n"
          REPORT+="- \`ro.product.brand\` (System): **$BRAND_PROP**\n\n"

          # 4. INSTALLED APPS
          REPORT+="### 4. App Directory Analysis\n"
          MIUI_HOME=$(find tree -type d -iname "MiuiHome" 2>/dev/null || true)
          POCO_HOME=$(find tree -type d -iname "PocoHome" 2>/dev/null || true)
          SEC_CENTER=$(find tree -type d -iname "*SecurityCenter*" 2>/dev/null || true)
          
          [ -n "$MIUI_HOME" ] && REPORT+="- ✅ **MiuiHome** found at \`$MIUI_HOME\`\n" || REPORT+="- ❌ MiuiHome missing\n"
          [ -n "$POCO_HOME" ] && REPORT+="- ✅ **PocoHome** found at \`$POCO_HOME\`\n" || REPORT+="- ❌ PocoHome missing\n"
          [ -n "$SEC_CENTER" ] && REPORT+="- ✅ **SecurityCenter** found at \`$SEC_CENTER\`\n" || REPORT+="- ❌ SecurityCenter missing\n"

          echo -e "$REPORT" >> "$GITHUB_STEP_SUMMARY"
